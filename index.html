<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Variáveis que serão alteradas pelo Banco de Dados */
        :root { --cor-principal: #003366; --prata: #E5E4E2; }
        
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: white; }
        
        /* Header Dinâmico */
        header { 
            background: var(--cor-principal); 
            padding: 20px; 
            text-align: center; 
            border-bottom: 3px solid var(--prata); 
        }

        /* Banner/Slider Dinâmico */
        .slider-container { width: 100%; height: 400px; overflow: hidden; position: relative; }
        .slide { 
            width: 100%; height: 100%; 
            background-size: cover; 
            background-position: center; 
            display: none; 
            animation: fade 1s;
        }
        .slide.active { display: block; }

        @keyframes fade { from { opacity: 0.4 } to { opacity: 1 } }

        .vitrine { padding: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 15px; border: 1px solid #333; text-align: center; }
        .card img { width: 100%; border-radius: 8px; }
        .btn-comprar { 
            background: var(--cor-principal); 
            color: white; border: none; padding: 10px; width: 100%; 
            border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; 
        }
    </style>
</head>
<body>

    <header>
        <h1 id="loja-nome">Carregando...</h1>
    </header>

    <div class="slider-container" id="slider">
        </div>

    <div class="vitrine" id="vitrine-jogos">
        </div>

    <script>
        const URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEAD = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` };

        // Função que faz a loja refletir o que está no painel
        async function carregarIdentidade() {
            const res = await fetch(`${URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEAD });
            const [cfg] = await res.json();

            if(cfg) {
                // Atualiza Nome e Título
                document.getElementById('loja-nome').innerText = cfg.loja_nome;
                document.title = cfg.loja_nome;

                // Atualiza a Cor Principal
                document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);

                // Atualiza os Banners (Slider)
                const slider = document.getElementById('slider');
                if(cfg.banners && cfg.banners.length > 0) {
                    slider.innerHTML = cfg.banners.map((url, i) => `
                        <div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>
                    `).join('');
                    iniciarSlider();
                }
            }
        }

        async function carregarJogos() {
            const res = await fetch(`${URL}/rest/v1/jogos`, { headers: HEAD });
            const jogos = await res.json();
            const vitrine = document.getElementById('vitrine-jogos');
            vitrine.innerHTML = jogos.map(j => `
                <div class="card">
                    <img src="${j.url_da_imagem}">
                    <h3>${j.nome}</h3>
                    <p style="color: #27ae60; font-weight: bold;">R$ ${j.preco}</p>
                    <button class="btn-comprar">COMPRAR AGORA</button>
                </div>
            `).join('');
        }

        // Lógica simples de giro do banner
        function iniciarSlider() {
            let atual = 0;
            const slides = document.querySelectorAll('.slide');
            if(slides.length <= 1) return;
            
            setInterval(() => {
                slides[atual].classList.remove('active');
                atual = (atual + 1) % slides.length;
                slides[atual].classList.add('active');
            }, 5000); // Muda a cada 5 segundos
        }

        window.onload = () => {
            carregarIdentidade();
            carregarJogos();
        };
    </script>
</body>
</html>
