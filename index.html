<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cor-principal: #003366; --prata: #E5E4E2; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: white; }
        
        header { background: var(--cor-principal); padding: 20px; text-align: center; border-bottom: 3px solid var(--prata); }

        /* Slider de Banners */
        .slider-container { width: 100%; height: 450px; position: relative; overflow: hidden; background: #1a1a1a; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1s; }
        .slide.active { opacity: 1; }

        /* Vitrine de Jogos */
        .vitrine { padding: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; text-align: center; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--cor-principal); }
        .card img { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; }
        
        /* Preços e Promoção */
        .preco-antigo { text-decoration: line-through; color: #888; font-size: 0.9rem; margin-right: 8px; }
        .preco-atual { color: #2ecc71; font-size: 1.3rem; font-weight: bold; }
        .badge-promo { position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }

        .btn-comprar { background: var(--cor-principal); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header><h1 id="loja-nome">MercantGames</h1></header>

    <div class="slider-container" id="slider">
        </div>

    <div class="vitrine" id="vitrine-jogos">
        </div>

    <script>
        const URL_SB = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY_SB = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` };

        async function sincronizarLoja() {
            try {
                // 1. Carrega Nome, Cor e Banners
                const resCfg = await fetch(`${URL_SB}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                
                if(cfg) {
                    document.getElementById('loja-nome').innerText = cfg.loja_nome;
                    document.title = cfg.loja_nome;
                    document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);
                    
                    if(cfg.banners && cfg.banners.length > 0) {
                        const slider = document.getElementById('slider');
                        slider.innerHTML = cfg.banners.map((url, i) => `
                            <div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>
                        `).join('');
                        iniciarGiro(cfg.banners.length);
                    }
                }

                // 2. Carrega os Jogos (Sincronizado com o novo painel)
                const resJogos = await fetch(`${URL_SB}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                const vitrine = document.getElementById('vitrine-jogos');
                
                vitrine.innerHTML = jogos.map(j => {
                    // Lógica de Preço Comparativo
                    const temPromo = j.preco_antigo && parseFloat(j.preco_antigo) > parseFloat(j.preco);
                    return `
                        <div class="card">
                            ${temPromo ? `<div class="badge-promo">PROMOÇÃO</div>` : ''}
                            <img src="${j.url_da_imagem}" alt="${j.nome}">
                            <h3 style="margin: 15px 0 10px 0;">${j.nome}</h3>
                            <div style="margin-bottom: 15px;">
                                ${temPromo ? `<span class="preco-antigo">R$ ${j.preco_antigo}</span>` : ''}
                                <span class="preco-atual">R$ ${j.preco}</span>
                            </div>
                            <button class="btn-comprar" onclick="alert('Ir para checkout do jogo: ${j.id}')">COMPRAR AGORA</button>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Erro na sincronização:", err);
            }
        }

        function iniciarGiro(total) {
            let atual = 0;
            const slides = document.querySelectorAll('.slide');
            if(total <= 1) return;
            setInterval(() => {
                slides[atual].classList.remove('active');
                atual = (atual + 1) % total;
                slides[atual].classList.add('active');
            }, 5000);
        }

        window.onload = sincronizarLoja;
    </script>
</body>
</html>
