<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Loja Gamer</title>
    <style>
        /* Cores da Marca: Prata (#E5E4E2) e Azul (#003366) */
        body { background-color: #E5E4E2; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        
        header { background-color: #003366; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #007BFF; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* Grid de Jogos - Os espaços de por os jogos */
        .grid-jogos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
        
        /* Estilo do Card de Jogo */
        .card-jogo { background: white; border: 2px solid #003366; border-radius: 12px; overflow: hidden; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-jogo:hover { transform: translateY(-8px); border-color: #007BFF; }
        
        .capa-reserva { width: 100%; height: 350px; background-color: #ccc; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; }
        
        .info { padding: 15px; text-align: center; }
        .titulo { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .preco { color: #007BFF; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        
        .btn-comprar { background-color: #003366; color: white; padding: 10px; display: block; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-comprar:hover { background-color: #007BFF; }
    </style>
</head>
<body>

<header>
    <h1>🎮 MINHA LOJA DE JOGOS</h1>
    <p>As melhores contas Steam Offline</p>
</header>

<div class="container">
    <div class="grid-jogos">
        
        <div class="card-jogo">
            <div class="capa-reserva">ESPAÇO PARA CAPA</div>
            <div class="info">
                <div class="titulo">Nome do Jogo Aqui</div>
                <div class="preco">R$ 00,00</div>
                <a href="#" class="btn-comprar">COMPRAR AGORA</a>

        </div>

        <div class="card-jogo">

            </div>
        </div>

        <div class="card-jogo">

            <div class="info">

                <div class="preco">R$ 00,00</div>
                <a href="#" class="btn-comprar">COMPRAR AGORA</a>
            </div>
        </div>

                <a href="#" class="btn-comprar">COMPRAR AGORA</a>

    </div>
</div>

</body>
</html>
