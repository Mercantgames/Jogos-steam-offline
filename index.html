<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Loja Gamer | Steam Offline</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=SUA_TAG_GOOGLE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'SUA_TAG_GOOGLE');
    </script>
    <style>
        body { background-color: #E5E4E2; font-family: 'Segoe UI', sans-serif; margin: 0; }
        header { background: #007BFF; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .game-card { background: white; border: 5px solid #007BFF; border-radius: 15px; overflow: hidden; transition: 0.3s; text-align: center; padding-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .game-card:hover { transform: translateY(-10px); }
        .game-card img { width: 100%; height: 380px; object-fit: cover; }
        .game-card h3 { margin: 15px 0 5px; color: #333; }
        .price { font-size: 26px; color: #007BFF; font-weight: bold; margin-bottom: 15px; }
        .btn-buy { background: #007BFF; color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 18px; display: inline-block; }
        footer { text-align: center; padding: 50px; color: #888; font-size: 13px; }
    </style>
</head>
<body>
    <header><h1>🎮 JOGOS STEAM OFFLINE</h1></header>
    <div class="container" id="vitrine"></div>
    <footer>
        <p>© 2026 Sua Loja Profissional | <a href="/admin.html" style="color:#007BFF">Painel de Controle</a></p>
    </footer>

    <script>
        const SB_URL = "SUA_URL_DO_SUPABASE";
        const SB_KEY = "SUA_KEY_ANON_DO_SUPABASE";

        async function carregarJogos() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?select=*`, {
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
            });
            const jogos = await res.json();
            const vitrine = document.getElementById('vitrine');
            jogos.forEach(j => {
                vitrine.innerHTML += `
                    <div class="game-card">
                        <img src="${j.imagem_url}">
                        <h3>${j.nome}</h3>
                        <div class="price">R$ ${j.preco.toFixed(2)}</div>
                        <a href="https://wa.me/SEUNUMERO" class="btn-buy">COMPRAR AGORA</a>
                    </div>`;
            });
        }
        carregarJogos();
    </script>
</body>
</html>
