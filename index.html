<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Loja Gamer | Oficial</title>
    <style>
        body { background: #E5E4E2; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Header Robusto em Azul */
        header { 
            background: #003366; 
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 8px solid #007BFF;
        }

        /* Barra de Busca que você viu na imagem */
        .search-container {
            max-width: 600px;
            margin: -30px auto 40px;
            padding: 0 20px;
        }
        #busca {
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-size: 18px;
        }

        /* Grid que preenche o site */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Card estilo Loja de Elite */
        .card {
            background: white;
            border-radius: 15px;
            border: 3px solid #003366;
            overflow: hidden;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card:hover { transform: scale(1.05); border-color: #007BFF; }

        .card img { width: 100%; height: 360px; object-fit: cover; }

        .card-info { padding: 20px; text-align: center; }
        .card-info h3 { margin: 0; font-size: 20px; color: #333; }
        .preco { color: #007BFF; font-size: 26px; font-weight: bold; margin: 15px 0; }

        .btn-whats {
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            display: block;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <h1>MINHA LOJA DE JOGOS</h1>
    <p>O melhor em Contas Steam Offline</p>
</header>

<div class="search-container">
    <input type="text" id="busca" placeholder="Qual jogo você procura?">
</div>

<div class="vitrine">
    <div class="card">
        <img src="https://shared.akamai.steamstatic.com/store_images/api/v2/1196590/library_600x900_2x.jpg">
        <div class="card-info">
            <h3>Resident Evil 4</h3>
            <div class="preco">R$ 29,90</div>
            <a href="#" class="btn-whats">🛒 Comprar Agora</a>
        </div>
    </div>

    <div class="card">
        <img src="https://shared.akamai.steamstatic.com/store_images/api/v2/1245620/library_600x900_2x.jpg">
        <div class="card-info">
            <h3>Elden Ring</h3>
            <div class="preco">R$ 34,90</div>
            <a href="#" class="btn-whats">🛒 Comprar Agora</a>
        </div>
    </div>

    <div class="card">
        <img src="https://shared.akamai.steamstatic.com/store_images/api/v2/1446780/library_600x900_2x.jpg">
        <div class="card-info">
            <h3>Monster Hunter Wilds</h3>
            <div class="preco">R$ 39,90</div>
            <a href="#" class="btn-whats">🛒 Comprar Agora</a>
        </div>
    </div>
    
    <div class="card">
        <img src="https://shared.akamai.steamstatic.com/store_images/api/v2/2050650/library_600x900_2x.jpg">
        <div class="card-info">
            <h3>Resident Evil Village</h3>
            <div class="preco">R$ 25,00</div>
            <a href="#" class="btn-whats">🛒 Comprar Agora</a>
        </div>
    </div>
</div>

<footer style="text-align: center; padding: 60px; color: #003366; font-weight: bold;">
    © 2026 Loja Gamer Offline - Todos os direitos reservados.
</footer>

</body>
</html>
