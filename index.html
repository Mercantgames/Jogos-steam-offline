<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --main: #003366;    /* Azul Marinho */
            --accent: #6a0dad;  /* Roxo */
            --silver: #c0c0c0;  /* Prata */
            --bg: #0b0e13; 
            --panel: #151921; 
        }
        
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: #000; padding: 15px 5%; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; 
        }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; }
        .logo span { color: var(--main); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* BANNER */
        .hero-banner { height: 400px; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #333; margin-bottom: 40px; }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .slide.active { opacity: 1; }

        /* VITRINE */
        .section-title { font-size: 1.4rem; margin-bottom: 25px; text-transform: uppercase; border-left: 5px solid var(--accent); padding-left: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
        
        /* CARD COMO LINK */
        .card { 
            background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid #222; 
            transition: 0.4s; text-align: center; text-decoration: none; color: white; display: block;
        }
        .card:hover { 
            border-color: var(--accent); transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(106, 13, 173, 0.2); 
        }
        .card img { width: 100%; height: 320px; object-fit: cover; transition: 0.5s; }
        .card:hover img { transform: scale(1.05); }
        
        .p-info { padding: 20px; }
        .p-info h4 { margin: 0 0 10px; font-size: 1.1rem; color: var(--silver); }
        .price { color: #2ecc71; font-weight: 800; font-size: 1.4rem; }
        
        .view-btn { 
            margin-top: 15px; display: inline-block; padding: 8px 20px; 
            background: var(--main); border-radius: 5px; font-size: 0.9rem; font-weight: bold; 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">MERCANT <span>GAMES</span></a>
        <div style="display:flex; gap:20px; font-size:1.3rem; cursor:pointer;">
            <i class="fas fa-search"></i>
            <i class="fas fa-shopping-bag"></i>
        </div>
    </header>

    <div class="container">
        <div class="hero-banner" id="slider">
            <div id="slides-area"></div>
        </div>

        <h2 class="section-title">Jogos em <span style="color:var(--main)">Destaque</span></h2>
        
        <div class="grid" id="vitrine"></div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            try {
                // Busca Banners
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg?.banners) {
                    const area = document.getElementById('slides-area');
                    area.innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                    let current = 0;
                    setInterval(() => {
                        const slides = document.querySelectorAll('.slide');
                        if(slides.length > 0) {
                            slides[current].classList.remove('active');
                            current = (current + 1) % slides.length;
                            slides[current].classList.add('active');
                        }
                    }, 5000);
                }

                // Busca Jogos e cria os Links para produto.html
                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                document.getElementById('vitrine').innerHTML = jogos.map(j => `
                    <a href="produto.html?id=${j.id}" class="card">
                        <img src="${j.url_da_imagem}" alt="${j.nome}">
                        <div class="p-info">
                            <h4>${j.nome}</h4>
                            <span class="price">R$ ${j.preco}</span>
                            <br>
                            <span class="view-btn">DETALHES</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) { console.error("Erro ao carregar:", e); }
        }
        window.onload = init;
    </script>
</body>
</html>
