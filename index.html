<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cor-principal: #003366; --prata: #E5E4E2; --bg: #121212; --card: #1e1e1e; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        /* Header Dinâmico */
        header { background: var(--cor-principal); padding: 25px; text-align: center; border-bottom: 4px solid var(--prata); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.8rem; }

        /* Slider de Banners Profissional */
        .slider-container { width: 100%; height: 500px; position: relative; overflow: hidden; background: #000; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease-in-out; }
        .slide.active { opacity: 1; }
        .slider-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(transparent, var(--bg)); }

        /* Vitrine Infinita e Responsiva */
        .vitrine { 
            padding: 50px 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 35px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        .card { 
            background: var(--card); 
            border-radius: 15px; 
            padding: 15px; 
            border: 1px solid #333; 
            text-align: center; 
            transition: all 0.4s ease; 
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--cor-principal); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        
        .card img { width: 100%; height: 350px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        
        .badge-promo { position: absolute; top: 20px; right: 20px; background: #ff4757; color: white; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; z-index: 10; }

        .preco-box { margin: 15px 0; }
        .preco-de { text-decoration: line-through; color: #777; font-size: 0.9rem; margin-right: 10px; }
        .preco-por { color: #2ed573; font-size: 1.5rem; font-weight: bold; }

        .btn-whats { 
            background: #25d366; color: white; border: none; padding: 15px; border-radius: 10px; 
            font-weight: bold; cursor: pointer; text-decoration: none; display: flex; 
            align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-whats:hover { background: #128c7e; }

        footer { text-align: center; padding: 40px; color: #555; border-top: 1px solid #222; margin-top: 50px; }
    </style>
</head>
<body>

    <header><h1 id="loja-nome">MercantGames</h1></header>

    <div class="slider-container" id="slider">
        <div class="slider-overlay"></div>
    </div>

    <div class="vitrine" id="vitrine-jogos">
        </div>

    <footer>&copy; 2026 MercantGames - Todos os direitos reservados.</footer>

    <script>
        const URL_SB = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY_SB = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` };
        const WHATSAPP_LOJA = "5511999999999"; // <-- COLOQUE SEU NÚMERO AQUI

        async function init() {
            try {
                // 1. CONFIGURAÇÕES (Nome, Cor, Banners)
                const resCfg = await fetch(`${URL_SB}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                
                if(cfg) {
                    document.getElementById('loja-nome').innerText = cfg.loja_nome;
                    document.title = cfg.loja_nome;
                    document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);
                    
                    if(cfg.banners && cfg.banners.length > 0) {
                        document.getElementById('slider').innerHTML = cfg.banners.map((url, i) => `
                            <div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>
                        `).join('') + '<div class="slider-overlay"></div>';
                        startSlider(cfg.banners.length);
                    }
                }

                // 2. PRODUTOS (Vitrine Infinita)
                const resJogos = await fetch(`${URL_SB}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                const vitrine = document.getElementById('vitrine-jogos');
                
                vitrine.innerHTML = jogos.map(j => {
                    const de = j.preco_antigo ? parseFloat(j.preco_antigo) : 0;
                    const por = parseFloat(j.preco);
                    const msg = encodeURIComponent(`Olá! Quero comprar o jogo: *${j.nome}* no valor de *R$ ${j.preco}*`);
                    const zapLink = `https://wa.me/${WHATSAPP_LOJA}?text=${msg}`;

                    return `
                        <div class="card">
                            ${de > por ? `<div class="badge-promo">OFERTA</div>` : ''}
                            <img src="${j.url_da_imagem}" alt="${j.nome}" onerror="this.src='https://via.placeholder.com/350x450?text=Imagem+Indisponivel'">
                            <h3 style="margin: 10px 0;">${j.nome}</h3>
                            <div class="preco-box">
                                ${de > por ? `<span class="preco-de">R$ ${de.toFixed(2)}</span>` : ''}
                                <span class="preco-por">R$ ${por.toFixed(2)}</span>
                            </div>
                            <a href="${zapLink}" target="_blank" class="btn-whats">
                                <i class="fab fa-whatsapp"></i> COMPRAR AGORA
                            </a>
                        </div>
                    `;
                }).join('');

            } catch (e) { console.error("Erro:", e); }
        }

        function startSlider(total) {
            let cur = 0;
            const s = document.querySelectorAll('.slide');
            if(total < 2) return;
            setInterval(() => {
                s[cur].classList.remove('active');
                cur = (cur + 1) % total;
                s[cur].classList.add('active');
            }, 5000);
        }

        window.onload = init;
    </script>
</body>
</html>
