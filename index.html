<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cor-principal: #003366; --accent: #00d2ff; --bg: #0b0e13; --card: #151921; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        /* Navbar */
        nav { background: rgba(0,0,0,0.8); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--cor-principal); text-transform: uppercase; }

        /* Banner Principal */
        .hero { width: 100%; height: 400px; position: relative; display: none; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: 1s; }
        .slide.active { opacity: 1; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 5%, transparent 100%); }

        /* Vitrine */
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
        .section-title { font-size: 1.2rem; border-left: 4px solid var(--cor-principal); padding-left: 15px; margin-bottom: 30px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .game-card { background: var(--card); border-radius: 8px; overflow: hidden; transition: 0.3s; border: 1px solid #222; cursor: pointer; }
        .game-card:hover { transform: scale(1.03); border-color: var(--cor-principal); box-shadow: 0 0 20px rgba(0,51,102,0.4); }
        .game-card img { width: 100%; height: 300px; object-fit: cover; }
        .game-info { padding: 15px; }
        .game-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; height: 40px; overflow: hidden; }
        .game-price { color: var(--accent); font-size: 1.2rem; font-weight: bold; }

        /* PÁGINA DO PRODUTO (MODAL OVERLAY) */
        .product-page { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 40px 5%; }
        .btn-back { cursor: pointer; margin-bottom: 20px; display: inline-block; color: #888; transition: 0.3s; }
        .btn-back:hover { color: #fff; }

        .product-layout { display: grid; grid-template-columns: 350px 1fr; gap: 40px; }
        .prod-img img { width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .buy-box { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .price-large { font-size: 2.5rem; font-weight: 800; color: #2ecc71; margin: 10px 0; }
        .btn-buy { background: var(--cor-principal); color: #fff; border: none; width: 100%; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 20px; }

        /* Abas Estilo Drex */
        .tabs { margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
        .tab-header { display: flex; gap: 30px; margin-bottom: 20px; border-bottom: 1px solid #222; }
        .tab-btn { padding: 10px 0; cursor: pointer; color: #888; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--cor-principal); border-bottom-color: var(--cor-principal); }
        .tab-content { line-height: 1.8; color: #bbb; font-size: 1rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" id="loja-nome">MercantGames</div>
        <div style="font-size: 1.2rem;"><i class="fas fa-search"></i></div>
    </nav>

    <div class="hero" id="hero">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <h2 class="section-title">Todos os Jogos</h2>
        <div class="grid" id="vitrine"></div>
    </div>

    <div id="product-page" class="product-page">
        <div class="btn-back" onclick="closeProduct()"><i class="fas fa-arrow-left"></i> Voltar para a loja</div>
        
        <div class="product-layout">
            <div class="prod-img">
                <img id="p-img" src="">
            </div>
            <div class="prod-main">
                <h1 id="p-title" style="font-size: 2.5rem; margin: 0;"></h1>
                <p style="color: #888;">Disponibilidade: <span style="color: #2ecc71;">Em estoque</span></p>
                
                <div class="buy-box">
                    <span style="font-size: 0.9rem; color: #888;">Preço Digital:</span>
                    <div class="price-large" id="p-price"></div>
                    <button class="btn-buy">ADICIONAR AO CARRINHO</button>
                    <p style="font-size: 0.8rem; color: #666; margin-top: 15px;"><i class="fas fa-shield-alt"></i> Compra Segura & Entrega Imediata</p>
                </div>

                <div class="tabs">
                    <div class="tab-header">
                        <div class="tab-btn active">DESCRIÇÃO</div>
                        <div class="tab-btn">COMO ATIVAR</div>
                    </div>
                    <div class="tab-content" id="p-desc"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };
        let jogosGlobal = [];

        async function load() {
            try {
                // Config Loja
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg) {
                    document.getElementById('loja-nome').innerText = cfg.loja_nome;
                    document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);
                    if(cfg.banners && cfg.banners.length > 0) {
                        const h = document.getElementById('hero');
                        h.style.display = 'block';
                        h.innerHTML = cfg.banners.map((u, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image:url('${u}')"></div>`).join('') + '<div class="hero-overlay"></div>';
                        startSlider(cfg.banners.length);
                    }
                }

                // Jogos
                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                jogosGlobal = await resJogos.json();
                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = jogosGlobal.map((j, i) => `
                    <div class="game-card" onclick="openProduct(${i})">
                        <img src="${j.url_da_imagem}">
                        <div class="game-info">
                            <div class="game-title">${j.nome}</div>
                            <div class="game-price">R$ ${j.preco}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function openProduct(i) {
            const j = jogosGlobal[i];
            document.getElementById('p-title').innerText = j.nome;
            document.getElementById('p-price').innerText = "R$ " + j.preco;
            document.getElementById('p-desc').innerText = j.descricao || "Sem detalhes.";
            document.getElementById('p-img').src = j.url_da_imagem;
            document.getElementById('product-page').style.display = "block";
            window.scrollTo(0,0);
        }

        function closeProduct() { document.getElementById('product-page').style.display = "none"; }

        function startSlider(t) {
            let cur = 0; const s = document.querySelectorAll('.slide');
            setInterval(() => { s[cur].classList.remove('active'); cur = (cur+1)%t; s[cur].classList.add('active'); }, 5000);
        }

        window.onload = load;
    </script>
</body>
</html>
