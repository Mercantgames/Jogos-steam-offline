<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #003366; --bg-dark: #05070a; --panel: #0d1117; --text-gray: #8b949e; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; }

        /* HEADER ESTILO DREX */
        header { background: #000; padding: 15px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .grid-jogos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        /* CARD DO JOGO */
        .game-card { background: var(--panel); border-radius: 4px; overflow: hidden; border: 1px solid #21262d; cursor: pointer; transition: 0.2s; }
        .game-card:hover { border-color: var(--main); transform: translateY(-3px); }
        .game-card img { width: 100%; height: 280px; object-fit: cover; }
        .game-card-body { padding: 12px; }
        .game-name { font-size: 14px; font-weight: 600; height: 35px; overflow: hidden; }
        .game-price { color: #39d353; font-weight: bold; font-size: 18px; margin-top: 8px; }

        /* --- PÁGINA DO PRODUTO (O QUE VOCÊ QUERIA) --- */
        #pagina-produto { display: none; padding-top: 20px; }
        .product-header { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        
        .product-left img { width: 100%; border-radius: 8px; border: 1px solid #30363d; }
        
        /* BOX DE COMPRA LATERAL */
        .buy-card { background: var(--panel); border-radius: 8px; padding: 25px; border: 1px solid #30363d; position: sticky; top: 100px; }
        .buy-card .price { font-size: 32px; font-weight: 800; color: #fff; display: block; margin-bottom: 20px; }
        .btn-comprar { background: var(--main); color: white; width: 100%; padding: 15px; border: none; border-radius: 5px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-comprar:hover { filter: brightness(1.2); }

        /* ABAS DE INFORMAÇÃO */
        .tabs-container { margin-top: 40px; background: var(--panel); border-radius: 8px; border: 1px solid #30363d; overflow: hidden; }
        .tabs-nav { display: flex; background: #161b22; border-bottom: 1px solid #30363d; }
        .tab-link { padding: 15px 30px; cursor: pointer; color: var(--text-gray); font-weight: bold; border-right: 1px solid #30363d; }
        .tab-link.active { background: var(--panel); color: #fff; border-top: 3px solid var(--main); }
        .tab-content { padding: 30px; line-height: 1.8; color: #c9d1d9; }

        .btn-voltar { color: var(--main); cursor: pointer; font-weight: bold; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

    <header><div class="logo">MERCANT GAMES</div></header>

    <div class="container" id="vitrine-principal">
        <h2 style="border-left: 5px solid var(--main); padding-left: 15px;">Destaques</h2>
        <div class="grid-jogos" id="lista-jogos"></div>
    </div>

    <div class="container" id="pagina-produto">
        <div class="btn-voltar" onclick="voltarLoja()"><i class="fas fa-arrow-left"></i> VOLTAR PARA A VITRINE</div>
        
        <div class="product-header">
            <div class="product-left">
                <img id="p-foto" src="">
                
                <div class="tabs-container">
                    <div class="tabs-nav">
                        <div class="tab-link active">DESCRIÇÃO DO PRODUTO</div>
                        <div class="tab-link">REQUISITOS</div>
                    </div>
                    <div class="tab-content" id="p-desc"></div>
                </div>
            </div>

            <div class="product-right">
                <div class="buy-card">
                    <h1 id="p-nome" style="font-size: 24px; margin-top: 0;"></h1>
                    <span class="price" id="p-preco"></span>
                    <button class="btn-comprar" onclick="alert('Indo para o pagamento...')">Comprar Agora</button>
                    <ul style="margin-top: 20px; padding: 0; list-style: none; font-size: 13px; color: var(--text-gray);">
                        <li><i class="fas fa-bolt"></i> Entrega Digital Imediata</li>
                        <li><i class="fas fa-check-circle"></i> Garantia Vitalícia</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };
        let DB_JOGOS = [];

        async function carregar() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            DB_JOGOS = await res.json();
            
            document.getElementById('lista-jogos').innerHTML = DB_JOGOS.map((j, i) => `
                <div class="game-card" onclick="verProduto(${i})">
                    <img src="${j.url_da_imagem}">
                    <div class="game-card-body">
                        <div class="game-name">${j.nome}</div>
                        <div class="game-price">R$ ${j.preco}</div>
                    </div>
                </div>
            `).join('');
        }

        function verProduto(i) {
            const j = DB_JOGOS[i];
            document.getElementById('vitrine-principal').style.display = 'none';
            document.getElementById('pagina-produto').style.display = 'block';
            
            document.getElementById('p-nome').innerText = j.nome;
            document.getElementById('p-preco').innerText = "R$ " + j.preco;
            document.getElementById('p-desc').innerText = j.descricao || "Nenhuma informação adicional.";
            document.getElementById('p-foto').src = j.url_da_imagem;
            window.scrollTo(0,0);
        }

        function voltarLoja() {
            document.getElementById('vitrine-principal').style.display = 'block';
            document.getElementById('pagina-produto').style.display = 'none';
        }

        window.onload = carregar;
    </script>
</body>
</html>
