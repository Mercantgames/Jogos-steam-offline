<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja de Jogos</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; margin: 0; }
        nav { background: #003366; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; border: 3px solid #007BFF; border-radius: 10px; text-align: center; overflow: hidden; }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card h3 { margin: 10px; font-size: 18px; color: #333; }
        .price { color: #007BFF; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .btn-buy { background: #003366; color: white; padding: 10px; margin: 10px; display: block; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <nav>MINHA LOJA DE JOGOS</nav>
    <div id="lista-jogos" class="vitrine">Carregando jogos...</div>

    <script>
        async function carregar() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos?select=*";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
            
            try {
                const res = await fetch(URL, { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } });
                const dados = await res.json();
                const lista = document.getElementById('lista-jogos');
                lista.innerHTML = '';
                
                dados.forEach(j => {
                    lista.innerHTML += `
                        <div class="card">
                            <img src="${j.imagem_url}">
                            <h3>${j.nome}</h3>
                            <div class="price">R$ ${parseFloat(j.preco).toFixed(2)}</div>
                            <a href="https://wa.me/SEUNUMERO" class="btn-buy">COMPRAR</a>
                        </div>`;
                });
            } catch (e) { document.getElementById('lista-jogos').innerHTML = "Erro ao carregar."; }
        }
        carregar();
    </script>
</body>
</html>
