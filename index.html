<style>
    :root { --azul: #003366; --prata: #E5E4E2; --branco: #ffffff; }
    body { background-color: #f4f4f4; margin: 0; font-family: 'Segoe UI', sans-serif; }

    /* Header Profissional */
    header { background: var(--azul); color: var(--prata); padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    header h1 { margin: 0; letter-spacing: 2px; font-size: 2rem; }

    /* Banner de Destaque */
    .banner { background: linear-gradient(rgba(0,51,102,0.7), rgba(0,51,102,0.7)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); 
               height: 250px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; text-align: center; flex-direction: column; }
    
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .section-title { color: var(--azul); border-left: 5px solid var(--azul); padding-left: 15px; margin-bottom: 30px; }

    /* Grid de Jogos */
    .grid-jogos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }

    /* Card do Jogo */
    .game-card { background: var(--branco); border-radius: 15px; overflow: hidden; border: 1px solid var(--prata); transition: 0.3s; position: relative; display: flex; flex-direction: column; }
    .game-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); border-color: var(--azul); }
    
    .img-container { width: 100%; height: 320px; background: #eee; overflow: hidden; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }

    .info { padding: 20px; text-align: center; }
    .info h3 { margin: 0 0 10px; color: var(--azul); font-size: 1.2rem; height: 50px; overflow: hidden; }
    .price { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 20px; }
    
    .btn-comprar { background: var(--azul); color: var(--prata); text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; display: block; transition: 0.3s; }
    .btn-comprar:hover { background: #004a94; color: white; }

    /* Grade em Branco (Skeleton) */
    .skeleton { background: #e0e0e0; height: 320px; width: 100%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
</style>

<header>
    <h1>MERCANT GAMES</h1>
    <p>A melhor experiência em jogos digitais</p>
</header>

<div class="banner">
    <h2>LANÇAMENTOS 2026</h2>
    <p>Confira as novidades do mês com os melhores preços</p>
</div>

<div class="container">
    <h2 class="section-title">TODOS OS JOGOS</h2>
    <div id="vitrine" class="grid-jogos">
        <div class="game-card"><div class="skeleton"></div><div class="info"><div style="height:20px; background:#eee; margin-bottom:10px"></div><div style="height:30px; background:#eee"></div></div></div>
        <div class="game-card"><div class="skeleton"></div><div class="info"><div style="height:20px; background:#eee; margin-bottom:10px"></div><div style="height:30px; background:#eee"></div></div></div>
        <div class="game-card"><div class="skeleton"></div><div class="info"><div style="height:20px; background:#eee; margin-bottom:10px"></div><div style="height:30px; background:#eee"></div></div></div>
        <div class="game-card"><div class="skeleton"></div><div class="info"><div style="height:20px; background:#eee; margin-bottom:10px"></div><div style="height:30px; background:#eee"></div></div></div>
    </div>
</div>

<script>
async function carregarLoja() {
    const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
    const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

    try {
        const res = await fetch(URL, { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } });
        const jogos = await res.json();
        const vitrine = document.getElementById('vitrine');
        
        if (jogos.length > 0) {
            vitrine.innerHTML = ""; // Remove os quadradinhos em branco se houver jogos
            jogos.forEach(jogo => {
                vitrine.innerHTML += `
                    <div class="game-card">
                        <div class="img-container">
                            <img src="${jogo.url_da_imagem}" alt="${jogo.nome}">
                        </div>
                        <div class="info">
                            <h3>${jogo.nome}</h3>
                            <div class="price">R$ ${parseFloat(jogo.preco).toFixed(2)}</div>
                            <a href="https://wa.me/5511999999999?text=Quero comprar ${jogo.nome}" class="btn-comprar">🛒 COMPRAR AGORA</a>
                        </div>
                    </div>`;
            });
        }
    } catch (e) { console.error("Erro ao carregar:", e); }
}
carregarLoja();
</script>
