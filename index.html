<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Jogos Offline</title>
    <style>
        /* Cores: Prata (#E5E4E2) e Azul (#003366) */
        body { background: #E5E4E2; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* Cabeçalho Profissional */
        header { background: #003366; color: white; padding: 40px 20px; text-align: center; border-bottom: 6px solid #007BFF; }
        header h1 { margin: 0; font-size: 32px; letter-spacing: 2px; }
        
        /* Barra de Busca */
        .search-container { max-width: 600px; margin: -25px auto 30px; padding: 0 20px; }
        #busca { width: 100%; padding: 15px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 16px; outline: none; }

        /* Vitrine em Grade */
        .vitrine { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        /* Card Estilo Profissional */
        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid #003366; 
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); border-color: #007BFF; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        /* Capa Vertical */
        .card img { width: 100%; height: 320px; object-fit: cover; background: #ddd; }

        .info { padding: 15px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0 0 10px; font-size: 18px; color: #333; height: 45px; overflow: hidden; }
        .preco { font-size: 24px; font-weight: bold; color: #007BFF; margin-bottom: 15px; }

        /* Botão WhatsApp */
        .btn-whats { 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-whats:hover { background: #128C7E; }
    </style>
</head>
<body>

<header>
    <h1>LOJA DE JOGOS OFFLINE</h1>
</header>

<div class="search-container">
    <input type="text" id="busca" placeholder="Pesquisar seu jogo..." onkeyup="filtrar()">
</div>

<div id="vitrine" class="vitrine">
    <p style="text-align: center; grid-column: 1/-1;">Carregando catálogo...</p>
</div>

<script>
    const NUMERO_WHATS = "5511999999999"; // COLOQUE SEU NUMERO AQUI
    const URL_BANCO = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos?select=*";
    const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

    let jogosAtuais = [];

    async function carregarLoja() {
        try {
            const res = await fetch(URL_BANCO, { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } });
            jogosAtuais = await res.json();
            renderizar(jogosAtuais);
        } catch (e) {
            document.getElementById('vitrine').innerHTML = "Erro ao carregar loja.";
        }
    }

    function renderizar(lista) {
        const vitrine = document.getElementById('vitrine');
        vitrine.innerHTML = '';

        lista.forEach(j => {
            const linkWhats = `https://wa.me/${NUMERO_WHATS}?text=Olá! Tenho interesse no jogo: ${j.nome}`;
            
            vitrine.innerHTML += `
                <div class="card">
                    <img src="${j.imagem_url}" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Capa'">
                    <div class="info">
                        <h3>${j.nome}</h3>
                        <div class="preco">R$ ${parseFloat(j.preco).toFixed(2)}</div>
                        <a href="${linkWhats}" target="_blank" class="btn-whats">
                            🛒 COMPRAR AGORA
                        </a>
                    </div>
                </div>`;
        });
    }

    function filtrar() {
        const termo = document.getElementById('busca').value.toLowerCase();
        const filtrados = jogosAtuais.filter(j => j.nome.toLowerCase().includes(termo));
        renderizar(filtrados);
    }

    carregarLoja();
</script>

</body>
</html>
