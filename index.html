<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #003366; --accent: #6a0dad; --bg: #0b0e13; --panel: #151921; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; }

        /* HEADER */
        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; text-transform: uppercase; }
        
        /* BOTÃO FLUTUANTE WHATSAPP */
        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px;
            background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center;
            font-size: 30px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); z-index: 10000;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); background-color: #128c7e; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .hero-banner { height: 400px; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #333; margin-bottom: 40px; }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .slide.active { opacity: 1; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
        .card { background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: 0.4s; text-decoration: none; color: white; display: block; }
        .card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .card img { width: 100%; height: 320px; object-fit: cover; }
        .p-info { padding: 20px; text-align: center; }
        .price { color: #2ecc71; font-weight: 800; font-size: 1.4rem; }
    </style>
</head>
<body>

    <a href="https://wa.me/5511999999999" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <header>
        <a href="index.html" class="logo">MERCANT <span style="color:var(--main)">GAMES</span></a>
        <div style="font-size:1.3rem;"><i class="fas fa-shopping-cart"></i></div>
    </header>

    <div class="container">
        <div class="hero-banner"><div id="slides-area"></div></div>
        <h2 style="border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 25px;">DESTAQUES</h2>
        <div class="grid" id="vitrine"></div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
            const [cfg] = await resCfg.json();
            if(cfg?.banners) {
                document.getElementById('slides-area').innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                let current = 0;
                setInterval(() => {
                    const slides = document.querySelectorAll('.slide');
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 5000);
            }

            const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            const jogos = await resJogos.json();
            document.getElementById('vitrine').innerHTML = jogos.map(j => `
                <a href="produto.html?id=${j.id}" class="card">
                    <img src="${j.url_da_imagem}">
                    <div class="p-info">
                        <h4>${j.nome}</h4>
                        <span class="price">R$ ${j.preco}</span>
                    </div>
                </a>
            `).join('');
        }
        window.onload = init;
    </script>
</body>
</html>
