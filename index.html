<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja MercantGames</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; }
        .vitrine { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; width: 250px; border: 1px solid #333; }
        .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; }
        .preco { color: #2ecc71; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MercantGames - Vitrine</h1>
    <div class="vitrine" id="vitrine">Carregando anúncios...</div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

        async function carregar() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?select=*`, {
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
            });
            const jogos = await res.json();
            
            const vitrine = document.getElementById('vitrine');
            if(jogos.length === 0) {
                vitrine.innerHTML = "<h2>Nenhum jogo encontrado. Cadastre no Admin!</h2>";
            } else {
                vitrine.innerHTML = jogos.map(j => `
                    <div class="card">
                        <img src="${j.url_da_imagem}">
                        <h3>${j.nome}</h3>
                        <p class="preco">R$ ${j.preco}</p>
                    </div>
                `).join('');
            }
        }
        window.onload = carregar;
    </script>
</body>
</html>
