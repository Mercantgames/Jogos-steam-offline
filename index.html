<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #003366; --bg: #0b0e13; --panel: #151921; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; text-transform: uppercase; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; }

        /* AREA DO BANNER */
        .hero-wrapper { position: relative; width: 100%; margin-top: 20px; }
        
        .hero-container { 
            height: 450px; 
            border-radius: 12px; 
            position: relative; 
            background: #000;
            border: 1px solid #333;
            overflow: hidden;
            z-index: 5;
        }

        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .slide.active { opacity: 1; }

        /* SOLDADOS POR FORA DO BANNER */
        .soldier-fixed {
            position: absolute;
            bottom: -20px;
            width: 350px; /* Soldados grandes e imponentes */
            z-index: 10;
            pointer-events: none;
        }

        .s-left {
            left: -280px; /* Joga para fora do banner no lado esquerdo */
            animation: fire-left 0.1s infinite alternate;
        }

        .s-right {
            right: -280px; /* Joga para fora do banner no lado direito */
            transform: scaleX(-1);
            animation: hit-right 0.15s infinite alternate;
        }

        /* FOGO DA ARMA */
        .muzzle {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #fff 5%, #ffde00 30%, transparent 70%);
            top: 38%;
            right: -30px;
            border-radius: 50%;
            animation: blink 0.05s infinite;
            box-shadow: 0 0 50px #ffae00;
        }

        @keyframes fire-left { from { transform: translateX(0); } to { transform: translateX(-15px); } }
        @keyframes hit-right { from { transform: scaleX(-1) translateX(0); } to { transform: scaleX(-1) translateX(8px) rotate(2deg); } }
        @keyframes blink { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* VITRINE */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 50px; }
        .game-card { background: var(--panel); border-radius: 8px; overflow: hidden; border: 1px solid #222; text-align: center; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--main); }
        .game-card img { width: 100%; height: 280px; object-fit: cover; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.3rem; padding: 10px; display: block; }

        /* RESPONSIVO: Esconde soldados em telas pequenas para não quebrar o site */
        @media (max-width: 1600px) {
            .soldier-fixed { width: 200px; }
            .s-left { left: -150px; }
            .s-right { right: -150px; }
        }
        @media (max-width: 1300px) {
            .soldier-fixed { display: none; } /* Esconde se a tela for pequena demais */
        }
    </style>
</head>
<body>

    <header><a href="#" class="logo">MERCANT GAMES</a></header>

    <div class="container">
        
        <div class="hero-wrapper">
            <div class="soldier-fixed s-left">
                <img src="https://www.pngmart.com/files/12/Call-of-Duty-Soldier-PNG-Transparent-Image.png" width="100%">
                <div class="muzzle"></div>
            </div>

            <div class="hero-container">
                <div id="slides-area"></div>
            </div>

            <div class="soldier-fixed s-right">
                <img src="https://www.pngmart.com/files/12/Battlefield-Soldier-PNG-Clipart.png" width="100%">
            </div>
        </div>

        <div class="game-grid" id="vitrine"></div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            try {
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg && cfg.banners) {
                    const area = document.getElementById('slides-area');
                    area.innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                    
                    let current = 0;
                    const slides = document.querySelectorAll('.slide');
                    setInterval(() => {
                        slides[current].classList.remove('active');
                        current = (current + 1) % slides.length;
                        slides[current].classList.add('active');
                    }, 5000);
                }

                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                document.getElementById('vitrine').innerHTML = jogos.map(j => `
                    <div class="game-card">
                        <img src="${j.url_da_imagem}">
                        <div style="padding:15px;">
                            <h4 style="margin:0;">${j.nome}</h4>
                            <span class="price">R$ ${j.preco}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        window.onload = init;
    </script>
</body>
</html>
