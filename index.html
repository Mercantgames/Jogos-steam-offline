<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #003366; --bg: #0b0e13; --panel: #151921; --accent: #00d2ff; --footer: #05070a; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; min-height: 100vh; }

        /* HEADER */
        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; text-decoration: none; text-transform: uppercase; }
        .search-bar { flex: 1; max-width: 500px; margin: 0 30px; position: relative; }
        .search-bar input { width: 100%; background: #1c2128; border: 1px solid #30363d; padding: 10px 15px; border-radius: 20px; color: white; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; box-sizing: border-box; }

        /* BANNER VIVO (SLIDER DINÂMICO) */
        .hero-container { margin-top: 10px; height: 450px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .slide.active { opacity: 1; }

        /* GRID CATEGORIAS */
        .section-title { font-size: 1.2rem; margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; font-weight: 600; text-transform: uppercase; }
        .section-title::before { content: ''; width: 4px; height: 20px; background: var(--main); display: inline-block; }
        
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .cat-card { height: 160px; border-radius: 10px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; border: 1px solid #222; }
        .cat-card h3 { position: relative; z-index: 2; font-size: 1.4rem; text-shadow: 2px 2px 5px #000; margin: 0; color: white; }
        .cat-card::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }

        /* VITRINE */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .game-card { background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: 0.3s; cursor: pointer; }
        .game-card:hover { border-color: var(--main); transform: translateY(-5px); }
        .game-card img { width: 100%; height: 300px; object-fit: cover; }
        .game-info { padding: 15px; text-align: center; }
        .game-price { color: #2ecc71; font-weight: 800; font-size: 1.3rem; margin: 10px 0; }
        .btn-comprar { background: var(--main); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

        /* RODAPÉ COMPLETO */
        footer { background: var(--footer); border-top: 1px solid #222; padding: 60px 5% 20px; margin-top: auto; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; margin-bottom: 40px; }
        .footer-box h4 { color: white; margin-bottom: 20px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        .footer-box p, .footer-box a { color: #888; text-decoration: none; font-size: 14px; display: block; margin-bottom: 10px; }
        .footer-box a:hover { color: var(--main); }
        .social-icons { display: flex; gap: 15px; font-size: 1.5rem; }
        .pay-icons { display: flex; flex-wrap: wrap; gap: 10px; font-size: 1.8rem; color: #444; }
        .copyright { text-align: center; border-top: 1px solid #111; padding-top: 20px; color: #444; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="location.reload()">MERCANT GAMES</a>
        <div class="search-bar"><input type="text" placeholder="Pesquisar jogos..."></div>
        <div style="display:flex; gap:20px; font-size:1.2rem; color:#fff; cursor:pointer;">
            <i class="fas fa-shopping-basket"></i>
            <i class="fas fa-user-circle"></i>
        </div>
    </header>

    <div id="home-view" class="container">
        <div class="hero-container" id="slider">
            </div>

        <h2 class="section-title">Categorias</h2>
        <div class="cat-grid">
            <div class="cat-card" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400')"><h3>ESPORTES</h3></div>
            <div class="cat-card" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400')"><h3>LUTA</h3></div>
            <div class="cat-card" style="background-image: url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=400')"><h3>AÇÃO</h3></div>
        </div>

        <h2 class="section-title">Destaques</h2>
        <div class="game-grid" id="vitrine"></div>
    </div>

    <footer>
        <div class="footer-grid">
            <div class="footer-box"><h4 style="color:var(--main)">MercantGames</h4><p>A tua loja de jogos digitais. Entrega imediata e suporte 24h.</p>
                <div class="social-icons"><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-discord"></i></a><a href="#"><i class="fab fa-whatsapp"></i></a></div>
            </div>
            <div class="footer-box"><h4>Navegação</h4><a href="#">Início</a><a href="#">Todos os Jogos</a><a href="#">Promoções</a></div>
            <div class="footer-box"><h4>Suporte</h4><a href="#">Dúvidas</a><a href="#">Garantia</a><a href="#">Contato</a></div>
            <div class="footer-box"><h4>Pagamento</h4><div class="pay-icons"><i class="fab fa-cc-visa"></i><i class="fab fa-cc-mastercard"></i><i class="fas fa-pix"></i><i class="fas fa-barcode"></i></div><p style="margin-top:15px;"><i class="fas fa-shield-alt"></i> Site Seguro</p></div>
        </div>
        <div class="copyright">© 2026 MercantGames - Todos os direitos reservados.</div>
    </footer>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            try {
                // 1. CARREGAR E INICIAR SLIDER (BANNER)
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                
                if(cfg && cfg.banners && cfg.banners.length > 0) {
                    const slider = document.getElementById('slider');
                    slider.innerHTML = cfg.banners.map((url, i) => `
                        <div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>
                    `).join('');
                    
                    if(cfg.banners.length > 1) {
                        let currentSlide = 0;
                        const slides = document.querySelectorAll('.slide');
                        setInterval(() => {
                            slides[currentSlide].classList.remove('active');
                            currentSlide = (currentSlide + 1) % slides.length;
                            slides[currentSlide].classList.add('active');
                        }, 5000); // Muda a cada 5 segundos
                    }
                }

                // 2. CARREGAR JOGOS NA VITRINE
                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                document.getElementById('vitrine').innerHTML = jogos.map(j => `
                    <div class="game-card">
                        <img src="${j.url_da_imagem}">
                        <div class="game-info">
                            <h4>${j.nome}</h4>
                            <div class="game-price">R$ ${j.preco}</div>
                            <button class="btn-comprar">VER DETALHES</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error("Erro:", e); }
        }
        window.onload = init;
    </script>
</body>
</html>
