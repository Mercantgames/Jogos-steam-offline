<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cor-principal: #003366; --prata: #E5E4E2; --bg: #121212; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        header { background: var(--cor-principal); padding: 25px; text-align: center; border-bottom: 4px solid var(--prata); }
        header h1 { margin: 0; letter-spacing: 2px; text-transform: uppercase; }

        .slider-container { width: 100%; height: 400px; position: relative; overflow: hidden; background: #000; display: none; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s; }
        .slide.active { opacity: 1; }

        .vitrine { padding: 50px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; }

        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--cor-principal); }
        .card img { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; }
        
        .preco { color: #2ed573; font-size: 1.5rem; font-weight: bold; margin: 10px 0; }

        /* JANELA DE DESCRIÇÃO (MODAL) */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1e1e1e; margin: 5% auto; padding: 30px; border: 1px solid var(--cor-principal); border-radius: 15px; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; color: #fff; font-size: 30px; cursor: pointer; }
        .modal-img { width: 100%; border-radius: 10px; }
        .modal-info h2 { color: var(--cor-principal); margin-top: 0; }
        .modal-info p { line-height: 1.6; color: #ccc; }

        @media (max-width: 700px) { .modal-content { grid-template-columns: 1fr; margin: 10% 20px; } }
    </style>
</head>
<body>

    <header><h1 id="loja-nome">MercantGames</h1></header>

    <div class="slider-container" id="slider"></div>

    <div class="vitrine" id="vitrine"></div>

    <div id="meuModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <img id="modal-img" class="modal-img">
            <div class="modal-info">
                <h2 id="modal-titulo"></h2>
                <div class="preco" id="modal-preco"></div>
                <p id="modal-desc"></p>
                <button style="background:#2ecc71; color:white; border:none; padding:15px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer;">EFETUAR COMPRA</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };
        let listaJogos = [];

        async function carregarTudo() {
            try {
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg) {
                    document.getElementById('loja-nome').innerText = cfg.loja_nome;
                    document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);
                    if(cfg.banners) { 
                        const slider = document.getElementById('slider');
                        slider.style.display = 'block';
                        slider.innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                        iniciarSlider(cfg.banners.length);
                    }
                }

                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos?select=*`, { headers: HEADERS });
                listaJogos = await resJogos.json();
                
                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = listaJogos.map((j, index) => `
                    <div class="card" onclick="abrirModal(${index})">
                        <img src="${j.url_da_imagem}">
                        <h3>${j.nome}</h3>
                        <p class="preco">R$ ${j.preco}</p>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function abrirModal(index) {
            const jogo = listaJogos[index];
            document.getElementById('modal-titulo').innerText = jogo.nome;
            document.getElementById('modal-preco').innerText = "R$ " + jogo.preco;
            document.getElementById('modal-desc').innerText = jogo.descricao || "Sem descrição disponível.";
            document.getElementById('modal-img').src = jogo.url_da_imagem;
            document.getElementById('meuModal').style.display = "block";
        }

        function fecharModal() { document.getElementById('meuModal').style.display = "none"; }

        function iniciarSlider(total) {
            let i = 0; const s = document.querySelectorAll('.slide');
            setInterval(() => { s[i].classList.remove('active'); i = (i + 1) % total; s[i].classList.add('active'); }, 5000);
        }

        window.onclick = function(event) { if (event.target == document.getElementById('meuModal')) fecharModal(); }
        window.onload = carregarTudo;
    </script>
</body>
</html>
