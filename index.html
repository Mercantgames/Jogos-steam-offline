<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Loja Offline</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; margin: 0; }
        nav { background: #003366; color: white; padding: 25px; text-align: center; font-size: 26px; font-weight: bold; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 30px; max-width: 1200px; margin: auto; }
        .game-card { background: white; border: 3px solid #007BFF; border-radius: 10px; overflow: hidden; text-align: center; }
        .game-card img { width: 100%; height: 310px; object-fit: cover; }
        .game-card h3 { padding: 10px; margin: 0; color: #333; }
        .price { color: #007BFF; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav>CONTAS STEAM OFFLINE</nav>
    <div id="vitrine" class="container">Carregando jogos...</div>

    <script>
        async function carregar() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos?select=*";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

            const res = await fetch(URL, { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } });
            const dados = await res.json();
            const div = document.getElementById('vitrine');
            div.innerHTML = '';

            dados.forEach(j => {
                div.innerHTML += `
                    <div class="game-card">
                        <img src="${j.imagem_url}">
                        <h3>${j.nome}</h3>
                        <div class="price">R$ ${j.preco.toFixed(2)}</div>
                    </div>`;
            });
        }
        carregar();
    </script>
</body>
</html>
