<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cor-principal: #003366; --prata: #E5E4E2; --bg: #121212; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        /* Barra Superior (Restaurada) */
        header { background: var(--cor-principal); padding: 25px; text-align: center; border-bottom: 4px solid var(--prata); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.8rem; }

        /* Slider de Banners (Restaurado) */
        .slider-container { width: 100%; height: 450px; position: relative; overflow: hidden; background: #000; display: none; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease-in-out; }
        .slide.active { opacity: 1; }
        .slider-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(transparent, var(--bg)); }

        /* Vitrine Infinita (A que funcionou!) */
        .vitrine { 
            padding: 50px 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 30px; 
            max-width: 1300px; 
            margin: 0 auto; 
        }

        .card { 
            background: #1e1e1e; 
            border-radius: 12px; 
            padding: 15px; 
            border: 1px solid #333; 
            text-align: center; 
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--cor-principal); }
        .card img { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        
        .preco { color: #2ed573; font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .btn-comprar { background: var(--cor-principal); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        footer { text-align: center; padding: 40px; color: #444; margin-top: 50px; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <header><h1 id="loja-nome">MercantGames</h1></header>

    <div class="slider-container" id="slider">
        <div class="slider-overlay"></div>
    </div>

    <div class="vitrine" id="vitrine">
        </div>

    <footer>&copy; 2026 MercantGames - Todos os direitos reservados.</footer>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function carregarTudo() {
            try {
                // 1. Carrega Configurações (Cores e Banners)
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                
                if(cfg) {
                    document.getElementById('loja-nome').innerText = cfg.loja_nome;
                    document.documentElement.style.setProperty('--cor-principal', cfg.cor_principal);
                    
                    if(cfg.banners && cfg.banners.length > 0) {
                        const slider = document.getElementById('slider');
                        slider.style.display = 'block';
                        slider.innerHTML = cfg.banners.map((url, i) => `
                            <div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>
                        `).join('') + '<div class="slider-overlay"></div>';
                        iniciarSlider(cfg.banners.length);
                    }
                }

                // 2. Carrega Jogos (Lógica que funcionou)
                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos?select=*`, { headers: HEADERS });
                const jogos = await resJogos.json();
                
                const vitrine = document.getElementById('vitrine');
                if(jogos.length === 0) {
                    vitrine.innerHTML = "<h2>Aguardando novos lançamentos...</h2>";
                } else {
                    vitrine.innerHTML = jogos.map(j => `
                        <div class="card">
                            <img src="${j.url_da_imagem}" onerror="this.src='https://via.placeholder.com/320x450?text=Imagem+Indisponivel'">
                            <h3>${j.nome}</h3>
                            <p class="preco">R$ ${j.preco}</p>
                            <button class="btn-comprar">DETALHES</button>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error("Erro ao carregar loja:", e); }
        }

        function iniciarSlider(total) {
            let index = 0;
            const slides = document.querySelectorAll('.slide');
            if(total < 2) return;
            setInterval(() => {
                slides[index].classList.remove('active');
                index = (index + 1) % total;
                slides[index].classList.add('active');
            }, 5000);
        }

        window.onload = carregarTudo;
    </script>
</body>
</html>
