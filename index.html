<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --main: #003366; --accent: #6a0dad; --silver: #c0c0c0; 
            --bg: #0b0e13; --panel: #151921; 
        }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: #000; padding: 15px 5%; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; 
        }
        .logo { font-size: 1.2rem; font-weight: 900; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: var(--main); }

        /* WHATSAPP FLUTUANTE */
        .whatsapp-float {
            position: fixed; width: 55px; height: 55px; bottom: 25px; right: 20px;
            background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center;
            font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10000;
            display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); filter: brightness(1.1); }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

        /* BANNER */
        .hero-banner { height: 180px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; margin-bottom: 25px; }
        @media (min-width: 768px) { .hero-banner { height: 400px; } }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .slide.active { opacity: 1; }

        /* VITRINE 2 COLUNAS MOBILE */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; } }

        .card { 
            background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid #222; 
            transition: 0.4s; text-decoration: none; color: white; display: flex; flex-direction: column;
        }
        .card img { width: 100%; height: 210px; object-fit: cover; transition: 0.5s; }
        @media (min-width: 768px) { .card img { height: 320px; } }
        
        .p-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .p-info h4 { margin: 5px 0; font-size: 0.95rem; font-weight: 500; color: var(--silver); line-height: 1.2; }
        .price { color: #2ecc71; font-weight: 800; font-size: 1.2rem; margin-top: 8px; }
    </style>
</head>
<body>

    <a href="https://wa.me/5511999999999" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <header>
        <a href="index.html" class="logo">MERCANT <span>GAMES</span></a>
        <i class="fas fa-shopping-cart" style="font-size: 1.2rem;"></i>
    </header>

    <div class="container">
        <div class="hero-banner" id="slider"><div id="slides-area"></div></div>
        <h2 style="border-left: 5px solid var(--accent); padding-left: 12px; font-size: 1.2rem; margin-bottom: 20px;">LANÇAMENTOS</h2>
        <div class="grid" id="vitrine"></div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            try {
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg?.banners) {
                    document.getElementById('slides-area').innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                    let current = 0;
                    setInterval(() => {
                        const slides = document.querySelectorAll('.slide');
                        slides[current].classList.remove('active');
                        current = (current + 1) % slides.length;
                        slides[current].classList.add('active');
                    }, 5000);
                }

                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                document.getElementById('vitrine').innerHTML = jogos.map(j => `
                    <a href="produto.html?id=${j.id}" class="card">
                        <img src="${j.url_da_imagem}">
                        <div class="p-info">
                            <h4>${j.nome}</h4>
                            <span class="price">R$ ${j.preco}</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) { console.error(e); }
        }
        window.onload = init;
    </script>
</body>
</html>
