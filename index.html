<div class="grid-jogos"></div>

<script>
async function carregarMercantGames() { 
    const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos"; 
    const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14"; 
    
    try { 
        const res = await fetch(URL, { 
            headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } 
        }); 
        const jogos = await res.json(); 
        const vitrine = document.querySelector('.grid-jogos'); 
        
        vitrine.innerHTML = ""; // Limpa a tela antes de carregar

        jogos.forEach(jogo => { 
            vitrine.innerHTML += `
                <div class="game-card" style="border: 2px solid #003366; padding: 15px; border-radius: 10px; background: #fff; text-align: center;">
                    <img src="${jogo.url_da_imagem}" style="width: 100%; border-radius: 5px;">
                    <h3 style="color: #003366;">${jogo.nome}</h3>
                    <p style="font-weight: bold;">R$ ${parseFloat(jogo.preco).toFixed(2)}</p>
                    <a href="https://wa.me/5511999999999" style="background: #003366; color: white; padding: 10px; display: block; text-decoration: none; border-radius: 5px;">🛒 Comprar Agora</a>
                </div>`; 
        }); 
    } catch (e) { 
        console.log("Erro ao carregar vitrine."); 
    } 
} 
carregarMercantGames();
</script>
