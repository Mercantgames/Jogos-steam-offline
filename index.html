<div id="vitrine" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: auto;">
    </div>

<script>
async function carregarLoja() {
    const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
    const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

    try {
        const res = await fetch(URL, { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } });
        const jogos = await res.json();
        const vitrine = document.getElementById('vitrine');
        
        vitrine.innerHTML = ""; 

        jogos.forEach(jogo => {
            vitrine.innerHTML += `
                <div style="background: white; border: 2px solid #E5E4E2; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-family: sans-serif;">
                    
                    <div style="width: 100%; height: 280px; overflow: hidden; background: #f0f0f0;">
                        <img src="${jogo.url_da_imagem}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>

                    <div style="padding: 15px; text-align: center;">
                        <h3 style="color: #003366; font-size: 16px; margin: 5px 0; text-transform: uppercase;">${jogo.nome}</h3>
                        <div style="font-size: 20px; font-weight: bold; color: #333; margin: 10px 0;">R$ ${parseFloat(jogo.preco).toFixed(2)}</div>
                        <a href="https://wa.me/5511999999999?text=Olá! Quero o jogo: ${jogo.nome}" 
                           style="background: #003366; color: #E5E4E2; text-decoration: none; padding: 10px; display: block; border-radius: 6px; font-weight: bold; font-size: 14px;">
                           🛒 COMPRAR AGORA
                        </a>
                    </div>
                </div>`;
        });
    } catch (e) {
        console.error("Erro:", e);
    }
}
carregarLoja();
</script>
