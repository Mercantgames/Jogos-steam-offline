<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercantGames | Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #003366; --bg: #0b0e13; --panel: #151921; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* AREA DO BANNER */
        .hero-container { 
            margin-top: 10px; 
            height: 450px; 
            border-radius: 12px; 
            position: relative; 
            background: #000;
            border: 1px solid #333;
            overflow: hidden; /* Corta o que sair do banner */
        }

        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .slide.active { opacity: 1; }

        /* CAMADA DOS SOLDADOS (Z-INDEX ALTO) */
        .warzone-layer { 
            position: absolute; 
            inset: 0; 
            z-index: 99; /* Garante que fica em cima das fotos */
            pointer-events: none; 
        }

        .soldier { 
            position: absolute; 
            bottom: 0; /* Colado no chão do banner */
            width: 280px; 
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
        }

        .soldier-left { 
            left: 0; 
            animation: shoot-anim 0.1s infinite alternate; 
        }

        .soldier-right { 
            right: 0; 
            transform: scaleX(-1); /* Vira para a esquerda */
            animation: hit-anim 0.15s infinite alternate;
        }

        /* FOGO DA ARMA */
        .flash {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff700 20%, #ff8c00 50%, transparent 70%);
            top: 35%; /* Ajustado para a altura da arma */
            right: -30px;
            border-radius: 50%;
            animation: blink-flash 0.05s infinite;
            box-shadow: 0 0 40px #ffae00;
        }

        /* ANIMAÇÕES */
        @keyframes shoot-anim { 
            from { transform: translateX(0); } 
            to { transform: translateX(-10px); } /* Recuo do tiro */
        }
        @keyframes hit-anim { 
            from { transform: scaleX(-1) translateX(0); } 
            to { transform: scaleX(-1) translateX(5px) rotate(1deg); } 
        }
        @keyframes blink-flash { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* GRID E RESTANTE */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 40px; }
        .game-card { background: var(--panel); border-radius: 8px; overflow: hidden; border: 1px solid #222; text-align: center; }
        .game-card img { width: 100%; height: 280px; object-fit: cover; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.2rem; padding-bottom: 15px; display: block;}
    </style>
</head>
<body>

    <header><a href="#" class="logo">MERCANT GAMES</a></header>

    <div class="container">
        <div class="hero-container">
            <div id="slides-area"></div>
            
            <div class="warzone-layer">
                <div class="soldier soldier-left">
                    <img src="https://www.pngmart.com/files/12/Call-of-Duty-Soldier-PNG-Transparent-Image.png" width="100%">
                    <div class="flash"></div>
                </div>
                <div class="soldier soldier-right">
                    <img src="https://www.pngmart.com/files/12/Battlefield-Soldier-PNG-Clipart.png" width="100%">
                </div>
            </div>
        </div>

        <div class="game-grid" id="vitrine"></div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function init() {
            try {
                const resCfg = await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
                const [cfg] = await resCfg.json();
                if(cfg && cfg.banners) {
                    const area = document.getElementById('slides-area');
                    area.innerHTML = cfg.banners.map((url, i) => `<div class="slide ${i === 0 ? 'active' : ''}" style="background-image: url('${url}')"></div>`).join('');
                    
                    let current = 0;
                    const slides = document.querySelectorAll('.slide');
                    setInterval(() => {
                        slides[current].classList.remove('active');
                        current = (current + 1) % slides.length;
                        slides[current].classList.add('active');
                    }, 5000);
                }

                const resJogos = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
                const jogos = await resJogos.json();
                document.getElementById('vitrine').innerHTML = jogos.map(j => `
                    <div class="game-card">
                        <img src="${j.url_da_imagem}">
                        <div style="padding:15px;">
                            <h4 style="margin:0 0 10px;">${j.nome}</h4>
                            <span class="price">R$ ${j.preco}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        window.onload = init;
    </script>
</body>
</html>
