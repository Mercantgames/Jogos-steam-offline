<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loja Gamer</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; margin: 0; }
        nav { background: #003366; color: white; padding: 20px; text-align: center; font-size: 22px; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; border: 3px solid #007BFF; border-radius: 10px; text-align: center; overflow: hidden; }
        .card img { width: 100%; height: 280px; object-fit: cover; }
    </style>
</head>
<body>
    <nav>MINHA LOJA DE JOGOS</nav>
    <div id="lista" class="vitrine">Carregando...</div>
    <script>
        async function b() {
            const r = await fetch("https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos?select=*", {
                headers: { 'apikey': "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14", 'Authorization': "Bearer sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14" }
            });
            const d = await r.json();
            const l = document.getElementById('lista');
            l.innerHTML = '';
            d.forEach(j => {
                l.innerHTML += `<div class="card"><img src="${j.imagem_url}"><h3>${j.nome}</h3><div style="color:#007BFF; font-weight:bold;">R$ ${j.preco.toFixed(2)}</div></div>`;
            });
        }
        b();
    </script>
</body>
</html>
