<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --main: #003366; /* Azul Marinho */
            --accent: #6a0dad; /* Roxo */
            --bg: #0b0e13; 
            --panel: #151921; 
        }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; }
        
        header { 
            background: #000; padding: 20px 5%; border-bottom: 2px solid var(--main); 
            display: flex; align-items: center;
        }
        .back-btn { color: white; text-decoration: none; font-weight: bold; font-size: 1rem; }

        .container { 
            max-width: 1100px; margin: 50px auto; padding: 20px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 50px; 
        }
        
        .product-image img { 
            width: 100%; border-radius: 15px; border: 1px solid #333; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5); 
        }
        
        .product-details h1 { font-size: 2.5rem; margin-top: 0; color: #fff; }
        .product-details .price { font-size: 2.2rem; color: #2ecc71; font-weight: 800; display: block; margin: 20px 0; }
        .product-details .desc { color: #bbb; line-height: 1.8; font-size: 1.1rem; margin-bottom: 40px; }
        
        .buy-now { 
            background: linear-gradient(90deg, var(--main), var(--accent)); 
            color: white; border: none; padding: 18px 50px; font-size: 1.3rem; 
            font-weight: 900; border-radius: 10px; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .buy-now:hover { transform: scale(1.02); filter: brightness(1.2); }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> VOLTAR PARA A LOJA</a>
    </header>

    <div class="container" id="product-content">
        <div style="grid-column: span 2; text-align: center;">Carregando detalhes do jogo...</div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');

        async function loadGame() {
            if(!gameId) {
                document.getElementById('product-content').innerHTML = "<h1>Jogo não encontrado!</h1>";
                return;
            }
            try {
                const res = await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${gameId}`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const [j] = await res.json();

                if(j) {
                    document.title = `${j.nome} | MercantGames`;
                    document.getElementById('product-content').innerHTML = `
                        <div class="product-image">
                            <img src="${j.url_da_imagem}" alt="${j.nome}">
                        </div>
                        <div class="product-details">
                            <h1>${j.nome}</h1>
                            <p class="desc">${j.descricao || 'Este título épico está disponível na MercantGames com entrega imediata e suporte total.'}</p>
                            <span class="price">R$ ${j.preco}</span>
                            <button class="buy-now">COMPRAR AGORA</button>
                        </div>
                    `;
                }
            } catch (e) {
                console.error(e);
            }
        }
        loadGame();
    </script>
</body>
</html>
