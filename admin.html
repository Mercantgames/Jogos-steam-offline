<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <style>
        body { background: #003366; font-family: sans-serif; padding: 50px; color: white; text-align: center; }
        .box { background: white; color: #333; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Cadastrar Jogo</h2>
        <input type="text" id="nome" placeholder="Nome do Jogo">
        <input type="number" id="preco" placeholder="Preço (Ex: 29.90)">
        <input type="text" id="capa" placeholder="Link da Imagem">
        <button onclick="salvar()">PUBLICAR AGORA</button>
    </div>

    <script>
        async function salvar() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
            
            const item = { 
                nome: document.getElementById('nome').value, 
                preco: parseFloat(document.getElementById('preco').value), 
                imagem_url: document.getElementById('capa').value 
            };

            const res = await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });

            if(res.ok) { alert("Sucesso!"); location.reload(); }
            else { alert("Erro ao salvar."); }
        }
    </script>
</body>
</html>
