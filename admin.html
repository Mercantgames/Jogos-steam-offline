<script>
  const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
  const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

  async function atualizarDados() {
    try {
      const response = await fetch(`${SB_URL}/rest/v1/jogos`, {
        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
      });
      const dados = await response.json();

      // Coloca a quantidade de jogos no campo de vendas
      const campoVendas = document.getElementById('vendas-db');
      if (campoVendas) campoVendas.innerText = dados.length;

      // Soma os preços e coloca no campo de receita
      const total = dados.reduce((acc, jogo) => acc + parseFloat(jogo.preco || 0), 0);
      const campoReceita = document.getElementById('receita-db');
      if (campoReceita) {
        campoReceita.innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
      }
      
      console.log("Dados sincronizados com o Supabase!");
    } catch (err) {
      console.error("Erro ao carregar dados:", err);
    }
  }

  // Executa a função
  atualizarDados();
</script>
