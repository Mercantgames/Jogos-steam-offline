<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --prata: #E5E4E2; --dark: #1a1a1a; --branco: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: #f4f4f4; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--azul); color: var(--prata); display: flex; flex-direction: column; padding: 20px 0; shrink: 0; }
        .sidebar h2 { text-align: center; font-size: 1.2rem; margin-bottom: 30px; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .menu-item { padding: 15px 25px; cursor: pointer; display: flex; align-items: center; transition: 0.3s; color: var(--prata); text-decoration: none; }
        .menu-item i { margin-right: 15px; width: 20px; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); border-left: 4px solid var(--prata); }

        /* Área de Conteúdo */
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .aba { display: none; }
        .aba.active { display: block; }

        /* Estilos Gerais */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--branco); padding: 20px; border-radius: 12px; border: 1px solid var(--prata); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card .valor { font-size: 1.8rem; font-weight: bold; color: var(--azul); margin-top: 10px; }
        .tabela-container { background: var(--branco); border-radius: 12px; border: 1px solid var(--prata); overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--azul); color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .form-group { background: var(--branco); padding: 25px; border-radius: 12px; border: 1px solid var(--prata); margin-bottom: 30px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn-acao { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MERCANT ADMIN</h2>
        <div class="menu-item active" onclick="mudarAba('vendas')"><i class="fas fa-chart-line"></i> Vendas</div>
        <div class="menu-item" onclick="mudarAba('produtos')"><i class="fas fa-gamepad"></i> Produtos</div>
        <div class="menu-item" onclick="mudarAba('clientes')"><i class="fas fa-users"></i> Clientes</div>
        <div class="menu-item" onclick="mudarAba('edicao')"><i class="fas fa-tools"></i> Editar Loja</div>
    </div>

    <div class="main">
        
        <div id="vendas" class="aba active">
            <h3>Financeiro</h3>
            <div class="stats-grid">
                <div class="stat-card"><h4>Saldo</h4><div class="valor" id="saldo-valor">R$ 0,00</div></div>
                <div class="stat-card"><h4>Pedidos</h4><div class="valor" id="vendas-total">0</div></div>
            </div>
            <div class="tabela-container"><table><thead><tr><th>ID</th><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th></tr></thead><tbody id="tabela-vendas-body"></tbody></table></div>
        </div>

        <div id="produtos" class="aba">
            <h3>Produtos</h3>
            <div class="form-group">
                <input type="text" id="prod_nome" placeholder="Nome">
                <input type="number" id="prod_preco" placeholder="Preço">
                <select id="prod_categoria"><option>Lançamentos</option><option>Ação</option></select>
                <input type="file" id="prod_arquivo">
                <button class="btn-acao" onclick="cadastrarProdutoMaster()">CADASTRAR</button>
            </div>
            <div class="tabela-container"><table><thead><tr><th>Capa</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="tabela-produtos-body"></tbody></table></div>
        </div>

        <div id="clientes" class="aba">
            <h3>Clientes</h3>
            <div class="tabela-container"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Gasto</th></tr></thead><tbody id="tabela-clientes-body"></tbody></table></div>
        </div>

        <div id="edicao" class="aba">
            <h3>Personalizar MercantGames</h3>
            <div class="form-group">
                <label>Nome da Loja:</label>
                <input type="text" id="cfg_nome" placeholder="Ex: MercantGames">
                <label>Link do Banner Principal:</label>
                <input type="text" id="cfg_banner" placeholder="URL da imagem (Google Drive/Imgur)">
                <label>Link do Launcher (.exe):</label>
                <input type="text" id="cfg_launcher" placeholder="Link para download">
                <label>Cor Identidade:</label>
                <input type="color" id="cfg_cor" style="height: 50px;">
                <button class="btn-acao" onclick="salvarConfiguracoes()">SALVAR ALTERAÇÕES 🚀</button>
            </div>
        </div>

    </div>

    <script>
        const URL_BASE = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' };

        function mudarAba(id) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'edicao') carregarConfiguracoes();
        }

        async function salvarConfiguracoes() {
            const data = {
                loja_nome: document.getElementById('cfg_nome').value,
                banner_url: document.getElementById('cfg_banner').value,
                launcher_url: document.getElementById('cfg_launcher').value,
                cor_principal: document.getElementById('cfg_cor').value
            };
            const res = await fetch(`${URL_BASE}/rest/v1/configuracoes?id=eq.1`, {
                method: 'PATCH', headers: HEADERS, body: JSON.stringify(data)
            });
            if(res.ok) alert("Configurações atualizadas!");
        }

        async function carregarConfiguracoes() {
            const res = await fetch(`${URL_BASE}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
            const [cfg] = await res.json();
            if(cfg) {
                document.getElementById('cfg_nome').value = cfg.loja_nome;
                document.getElementById('cfg_banner').value = cfg.banner_url || '';
                document.getElementById('cfg_launcher').value = cfg.launcher_url || '';
                document.getElementById('cfg_cor').value = cfg.cor_principal;
            }
        }

        // Funções de Vendas/Produtos/Clientes (Mantidas da v2)
        async function listarProdutos() {
            const res = await fetch(`${URL_BASE}/rest/v1/jogos`, { headers: HEADERS });
            const produtos = await res.json();
            const body = document.getElementById('tabela-produtos-body');
            body.innerHTML = "";
            produtos.forEach(p => {
                body.innerHTML += `<tr><td><img src="${p.url_da_imagem}" width="40"></td><td>${p.nome}</td><td>R$ ${p.preco}</td><td>Excluir</td></tr>`;
            });
        }

        window.onload = () => { listarProdutos(); carregarConfiguracoes(); };
    </script>
</body>
</html>
