<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MercantGames - Painel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Reset básico */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background-color: #f9fafb; }
    .sidebar {
      width: 256px;
      background: white;
      border-right: 1px solid #e5e7eb;
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      overflow-y: auto;
    }
    .header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: fixed;
      top: 0; left: 256px; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
    }
    .main-content {
      margin-left: 256px;
      margin-top: 64px;
      min-height: calc(100vh - 64px);
      padding: 24px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: #374151;
      text-decoration: none;
    }
    .menu-item:hover { background-color: #f3f4f6; }
    .menu-item.active { background-color: #eff6ff; color: #2563eb; }
    .stat-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-size: 14px;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: white;
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: none;
      z-index: 100;
      border-left: 4px solid #10b981;
    }
    .toast.active {
      display: block;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f3f4f6;
    }
    th {
      background-color: #f9fafb;
      font-weight: 500;
      color: #6b7280;
      font-size: 14px;
    }
    tr:hover {
      background-color: #f9fafb;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-success { background-color: #d1fae5; color: #065f46; }
    .badge-warning { background-color: #fef3c7; color: #92400e; }
    .badge-info { background-color: #dbeafe; color: #1e40af; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }
    input, select, textarea {
      width: 100%;
      padding: 8px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      ring: 2px;
      ring-color: #2563eb;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .product-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .product-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .product-image {
      width: 100%;
      aspect-ratio: 1;
      background-color: #f3f4f6;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div id="toast" class="toast">
  <div class="flex items-center gap-2">
    <i class="fas fa-check-circle text-green-600"></i>
    <span id="toast-message"></span>
  </div>
</div>

<aside class="sidebar">
  <div class="h-16 flex items-center px-6 border-b border-gray-200">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <i class="fas fa-gamepad text-white"></i>
      </div>
      <span class="font-semibold text-lg">MercantGames</span>
    </div>
  </div>
  <nav class="p-4">
    <a href="#" class="menu-item active" data-section="dashboard"><i class="fas fa-home w-5"></i><span>Dashboard</span></a>
    <a href="#" class="menu-item" data-section="jogos"><i class="fas fa-gamepad w-5"></i><span>Jogos</span></a>
    <a href="#" class="menu-item" data-section="minha-loja"><i class="fas fa-store w-5"></i><span>Minha Loja</span></a>
  </nav>
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; border-top: 1px solid #e5e7eb; background: white;">
    <div class="flex items-center gap-3 px-4 py-2">
      <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center">
        <span class="text-sm font-medium text-gray-700">AD</span>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-900">Admin</p>
        <p class="text-xs text-gray-500">admin@mercantgames.com</p>
      </div>
    </div>
  </div>
</aside>

<header class="header">
  <div style="flex: 1; max-width: 600px;">
    <div style="position: relative;">
      <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af;"></i>
      <input id="search-input" type="text" placeholder="Buscar jogos..." style="padding-left: 40px;" />
    </div>
  </div>
  <div class="flex items-center gap-4">
    <button class="p-2 hover:bg-gray-100 rounded-lg" style="position: relative;">
      <i class="fas fa-bell text-gray-600"></i>
      <span style="position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%;"></span>
    </button>
    <button class="btn btn-primary" id="btn-ver-loja">Ver Loja</button>
  </div>
</header>

<main class="main-content">
  <!-- Dashboard -->
  <section id="dashboard" class="section">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="stat-card">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-green-500 w-12 h-12 rounded-lg flex items-center justify-center">
            <i class="fas fa-dollar-sign text-white"></i>
          </div>
          <span class="text-sm text-green-600 font-medium">Vendas</span>
        </div>
        <p id="dash-money" class="text-2xl font-bold text-gray-900">R$ 0,00</p>
        <p class="text-sm text-gray-500 mt-1">Total em vendas</p>
      </div>
      <div class="stat-card">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-blue-500 w-12 h-12 rounded-lg flex items-center justify-center">
            <i class="fas fa-gamepad text-white"></i>
          </div>
          <span class="text-sm text-blue-600 font-medium">Jogos</span>
        </div>
        <p id="dash-count" class="text-2xl font-bold text-gray-900">0</p>
        <p class="text-sm text-gray-500 mt-1">Total de jogos</p>
      </div>
      <!-- Outros cards podem vir aqui -->
    </div>
  </section>

  <!-- Jogos -->
  <section id="jogos" class="section hidden">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Jogos</h1>
      <button class="btn btn-primary" id="btn-novo-jogo">Novo Jogo</button>
    </div>
    <div id="lista-jogos" class="product-grid"></div>
  </section>

  <!-- Minha Loja -->
  <section id="minha-loja" class="section hidden max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Minha Loja - Configurações</h1>
    
    <form id="form-loja" class="space-y-6">
      <div>
        <label for="nome-loja" class="block mb-1 font-medium">Nome da Loja</label>
        <input type="text" id="nome-loja" placeholder="Nome da loja" />
      </div>
      <div>
        <label for="cor-loja" class="block mb-1 font-medium">Cor Principal</label>
        <input type="color" id="cor-loja" value="#2563eb" />
      </div>
      <div>
        <label for="fonte-loja" class="block mb-1 font-medium">Fonte</label>
        <select id="fonte-loja">
          <option value="Inter" selected>Inter</option>
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
        </select>
      </div>
      <div>
        <label for="banner-loja" class="block mb-1 font-medium">Banner (URL)</label>
        <input type="text" id="banner-loja" placeholder="URL da imagem do banner" />
      </div>
      <div>
        <label for="logo-loja" class="block mb-1 font-medium">Logo (URL)</label>
        <input type="text" id="logo-loja" placeholder="URL da imagem do logo" />
      </div>
      <div>
        <label for="politicas-loja" class="block mb-1 font-medium">Políticas da Loja</label>
        <textarea id="politicas-loja" rows="5" placeholder="Descreva suas políticas"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Configurações</button>
    </form>
  </section>
</main>

<script>
  // Variáveis globais
  const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
  const API_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
  const headers = {
    "apikey": API_KEY,
    "Authorization": `Bearer ${API_KEY}`,
    "Content-Type": "application/json",
    "Accept": "application/json",
  };

  // Cores por categoria
  const cores = {
    "Acao": "#ef4444",       // vermelho
    "RPG": "#22c55e",        // verde
    "Aventura": "#f97316",   // laranja
    "Esporte": "#3b82f6",    // azul
  };

  // Elementos
  const menuItens = document.querySelectorAll(".menu-item");
  const sections = document.querySelectorAll(".section");
  const listaJogos = document.getElementById("lista-jogos");

  // Toast
  const toast = document.getElementById("toast");
  const toastMessage = document.getElementById("toast-message");

  // Função para mostrar toast
  function showToast(msg) {
    toastMessage.textContent = msg;
    toast.classList.add("active");
    setTimeout(() => toast.classList.remove("active"), 3000);
  }

  // Navegação entre seções
  menuItens.forEach(item => {
    item.addEventListener("click", e => {
      e.preventDefault();
      const target = item.getAttribute("data-section");

      // Atualizar menu ativo
      menuItens.forEach(i => i.classList.remove("active"));
      item.classList.add("active");

      // Mostrar a seção correta
      sections.forEach(sec => {
        if (sec.id === target) sec.classList.remove("hidden");
        else sec.classList.add("hidden");
      });

      // Se for jogos, recarregar
      if (target === "jogos") carregarJogos();
    });
  });

  // Função para carregar jogos do Supabase
  async function carregarJogos() {
    try {
      const r = await fetch(URL + "?select=*", { headers });
      if (!r.ok) throw new Error("Erro Supabase: " + r.status);

      const dados = await r.json();

      let total = 0;
      listaJogos.innerHTML = "";

      dados.forEach(j => {
        total += Number(j.preco);

        // Pegando a cor, default cinza se categoria não cadastrada
        const cor = cores[j.categoria] || "#9ca3af";

        listaJogos.innerHTML += `
          <div class="product-card" style="border-top: 4px solid ${cor}; padding: 16px;">
            <b>${j.nome}</b>
            <p class="text-gray-600">${j.categoria}</p>
            <p class="text-gray-900 font-semibold">R$ ${Number(j.preco).toFixed(2)}</p>
          </div>
        `;
      });

      document.getElementById("dash-count").innerText = dados.length;
      document.getElementById("dash-money").innerText = "R$ " + total.toFixed(2);
    } catch (e) {
      console.error("Erro ao carregar jogos:", e);
      showToast("Erro ao carregar jogos");
    }
  }

  // Inicialização padrão: mostra dashboard e carrega jogos para calcular totais
  function init() {
    sections.forEach(sec => {
      if (sec.id === "dashboard") sec.classList.remove("hidden");
      else sec.classList.add("hidden");
    });
    menuItens.forEach(i => i.classList.remove("active"));
    document.querySelector('.menu-item[data-section="dashboard"]').classList.add("active");

    carregarJogos();
  }

  // Minha Loja: salvar e carregar configurações no localStorage
  const formLoja = document.getElementById("form-loja");

  // Carregar configs da loja
  function carregarConfigLoja() {
    const nome = localStorage.getItem("nomeLoja") || "";
    const cor = localStorage.getItem("corLoja") || "#2563eb";
    const fonte = localStorage.getItem("fonteLoja") || "Inter";
    const banner = localStorage.getItem("bannerLoja") || "";
    const logo = localStorage.getItem("logoLoja") || "";
    const politicas = localStorage.getItem("politicasLoja") || "";

    document.getElementById("nome-loja").value = nome;
    document.getElementById("cor-lo
