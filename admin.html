<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <style>
        body { background: #003366; font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007BFF; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastrar Jogo</h2>
        <input type="text" id="nome" placeholder="Nome do Jogo">
        <input type="number" id="preco" placeholder="Preço (ex: 29.90)">
        <input type="text" id="img" placeholder="URL da Imagem (Capa Vertical)">
        <button onclick="salvar()">PUBLICAR NA LOJA</button>
    </div>

    <script>
        const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
        const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

        async function salvar() {
            const dados = { 
                nome: document.getElementById('nome').value, 
                preco: parseFloat(document.getElementById('preco').value), 
                imagem_url: document.getElementById('img').value 
            };

            const res = await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if(res.ok) { alert("✅ Jogo salvo!"); location.reload(); }
            else { alert("❌ Erro ao salvar."); }
        }
    </script>
</body>
</html>
