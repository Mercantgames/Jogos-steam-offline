<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* BASE DO DESIGN NIMBUS */
        :root {
            --nimbus-spacing-1: 4px;
            --nimbus-spacing-2: 8px;
            --nimbus-spacing-6: 24px;
            --nimbus-colors-primary-surface: #e5f0ff;
            --nimbus-colors-primary-surfaceHighlight: #cce0ff;
            --nimbus-colors-neutral-surfaceDisabled: #f2f2f2;
            --nimbus-colors-primary-interactive: #0066ff;
            --nimbus-colors-neutral-textHigh: #1a1f36;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; }

        /* SIDEBAR BASE */
        .sidebar { width: 260px; background: #fff; height: 100vh; border-right: 1px solid #d8dee4; position: fixed; }
        .sidebar-logo { padding: 24px; font-weight: 800; color: #0066ff; font-size: 1.4rem; border-bottom: 1px solid #f0f2f5; }

        /* O CÓDIGO QUE VOCÊ ENVIOU (ADAPTADO) */
        .nimbus-menu-container {
            padding-left: var(--nimbus-spacing-6);
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        .nimbus-link {
            padding: 8px 16px;
            align-items: center;
            text-decoration: none;
            background-color: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            width: 90%;
            transition: all 0.2s;
            max-height: 34px;
            box-sizing: border-box;
        }

        .nimbus-link:hover { background-color: var(--nimbus-colors-primary-surface); }
        .nimbus-link.active { background-color: var(--nimbus-colors-primary-surface); }

        .nimbus-text {
            font-size: 14px;
            color: var(--nimbus-colors-neutral-textHigh);
            margin: 0;
            font-weight: 400;
        }

        .nimbus-link.active .nimbus-text { color: var(--nimbus-colors-primary-interactive); font-weight: 600; }

        .nimbus-tag-beta {
            background: #e5f0ff;
            color: #0066ff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: 700;
        }

        /* ÁREA DE CONTEÚDO */
        .main-content { margin-left: 260px; padding: 40px; width: 100%; }
        .nimbus-card { background: #fff; border: 1px solid #d8dee4; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #1a1f36; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">nuvemshop</div>
        
        <div class="nimbus-menu-container">
            <a class="nimbus-link active" onclick="tab('dash')">
                <p class="nimbus-text">Início</p>
            </a>
            <a class="nimbus-link" onclick="tab('lista')">
                <p class="nimbus-text">Lista de produtos</p>
            </a>
            <a class="nimbus-link">
                <p class="nimbus-text">Inventário</p>
            </a>
            <a class="nimbus-link">
                <p class="nimbus-text">Categorias</p>
            </a>
            <a class="nimbus-link">
                <p class="nimbus-text">Tabelas de preços</p>
                <span class="nimbus-tag-beta">Beta</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div id="dash" class="section">
            <h1 style="font-size: 1.5rem; margin-bottom: 24px;">Visão geral</h1>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="nimbus-card">
                    <p style="font-size: 0.8rem; color: #666;">Vendas</p>
                    <div class="stat-value" id="val-vendas">0</div>
                </div>
                <div class="nimbus-card">
                    <p style="font-size: 0.8rem; color: #666;">Receita</p>
                    <div class="stat-value" id="val-receita">R$ 0,00</div>
                </div>
                <div class="nimbus-card">
                    <p style="font-size: 0.8rem; color: #666;">Ticket Médio</p>
                    <div class="stat-value" id="val-ticket">R$ 0,00</div>
                </div>
            </div>
        </div>

        <div id="lista" class="section" style="display:none;">
            <h1>Lista de Produtos</h1>
            <div class="nimbus-card">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 1px solid #eee;">
                            <th style="padding: 10px;">Produto</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            
            // Ativa o link no menu
            document.querySelectorAll('.nimbus-link').forEach(l => l.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            carregarDados();
        }

        async function carregarDados() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            const jogos = await res.json();

            // Stats
            document.getElementById('val-vendas').innerText = jogos.length;
            const total = jogos.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            document.getElementById('val-receita').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
            document.getElementById('val-ticket').innerText = `R$ ${(total/jogos.length || 0).toLocaleString('pt-br', {minimumFractionDigits: 2})}`;

            // Tabela
            document.getElementById('lista-corpo').innerHTML = jogos.map(j => `
                <tr style="border-bottom: 1px solid #f9f9f9;">
                    <td style="padding: 12px;">${j.nome}</td>
                    <td>R$ ${j.preco}</td>
                </tr>
            `).join('');
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
