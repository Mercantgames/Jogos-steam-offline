<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin Automático | MercantGames</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 10px; border: 2px solid #003366; max-width: 450px; margin: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; margin-top: 0; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #003366; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        button:hover { background: #007BFF; }
    </style>
</head>
<body>
    <div class="box">
        <h2>CADASTRAR JOGO</h2>
        <input type="text" id="nome" placeholder="Nome do Jogo">
        <input type="number" id="preco" placeholder="Preço (ex: 29.90)">
        <input type="text" id="imagem" placeholder="Link da Imagem (URL)">
        <select id="categoria">
            <option value="lancamentos">Lançamentos</option>
            <option value="vendidos">Mais Vendidos</option>
            <option value="atemporais">Atemporais</option>
        </select>
        <button onclick="enviarJogo()">PUBLICAR NA LOJA</button>
    </div>

    <script>
        async function enviarJogo() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

            const dados = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem_url: document.getElementById('imagem').value,
                categoria: document.getElementById('categoria').value
            };

            const res = await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if(res.ok) { alert("🚀 Sucesso! O jogo já deve estar na loja."); }
            else { alert("❌ Erro ao enviar. Verifique o banco de dados."); }
        }
    </script>
</body>
</html>
