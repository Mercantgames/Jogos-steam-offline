<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin MercantGames</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; border: 2px solid #003366; width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #003366; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #007BFF; }
    </style>
</head>
<body>
    <div class="card">
        <h2>CADASTRAR JOGO</h2>
        <input type="text" id="nome" placeholder="Nome do Jogo">
        <input type="number" id="preco" placeholder="Preço (R$)">
        <input type="text" id="imagem" placeholder="Link da Imagem (Capa)">
        <button onclick="salvarNoBanco()">PUBLICAR NA LOJA</button>
    </div>

    <script>
        async function salvarNoBanco() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

            const dados = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                url_da_imagem: document.getElementById('imagem').value // Usando o nome exato da sua tabela
            };

            const res = await fetch(URL, {
                method: 'POST',
                headers: { 
                    'apikey': KEY, 
                    'Authorization': `Bearer ${KEY}`, 
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(dados)
            });

            if(res.ok) {
                alert("🚀 SUCESSO! O jogo foi enviado para a MercantGames.");
                document.getElementById('nome').value = "";
                document.getElementById('preco').value = "";
                document.getElementById('imagem').value = "";
            } else {
                alert("❌ ERRO: Verifique se o RLS está desativado no Supabase.");
            }
        }
    </script>
</body>
</html>
