<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | MercantGames Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #0066ff; --bg: #f5f7f9; --border: #dce1e5; --text: #333; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; color: var(--text); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: #fff; height: 100vh; position: fixed; border-right: 1px solid var(--border); }
        .sidebar-logo { padding: 25px; font-weight: bold; color: var(--blue); border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 12px; color: #666; text-decoration: none; font-size: 0.9rem; }
        .nav-item.active { background: #f0f7ff; color: var(--blue); font-weight: 600; border-left: 4px solid var(--blue); }

        /* CONTEÚDO PRINCIPAL */
        .main { margin-left: 240px; width: calc(100% - 240px); padding: 30px 40px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-primary { background: var(--blue); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* FILTROS E BUSCA */
        .filter-bar { background: #fff; padding: 15px; border-radius: 8px 8px 0 0; border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; }
        .search-input { flex-grow: 1; padding: 10px; border: 1px solid var(--border); border-radius: 4px; outline: none; }

        /* TABELA ESTILO NUVEMSHOP */
        .table-container { background: #fff; border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fcfcfc; padding: 15px; text-align: left; font-size: 0.75rem; color: #999; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; vertical-align: middle; }
        
        .prod-info { display: flex; align-items: center; gap: 15px; }
        .prod-info img { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; border: 1px solid #eee; }
        .prod-name { font-weight: 600; color: var(--blue); text-decoration: none; display: block; margin-bottom: 4px; }
        .prod-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .tag-small { font-size: 0.65rem; background: #f0f0f0; padding: 2px 6px; border-radius: 10px; color: #777; border: 1px solid #ddd; }

        .price-input { width: 80px; padding: 6px; border: 1px solid var(--border); border-radius: 4px; text-align: right; }
        .stock-inf { color: #999; font-size: 1.2rem; }

        .action-icons { display: flex; gap: 10px; color: #ccc; }
        .action-icons i { cursor: pointer; transition: 0.2s; }
        .action-icons i:hover { color: var(--blue); }
        .delete-btn:hover { color: #ff4d4d !important; }

        /* MODAL CADASTRO (SIMPLIFICADO) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; width: 600px; padding: 30px; border-radius: 8px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-shopping-bag"></i> MercantGames</div>
        <nav style="margin-top: 20px;">
            <a href="#" class="nav-item"><i class="fas fa-home"></i> Início</a>
            <a href="#" class="nav-item active"><i class="fas fa-box"></i> Produtos</a>
            <a href="#" class="nav-item"><i class="fas fa-shopping-cart"></i> Vendas</a>
        </nav>
    </aside>

    <main class="main">
        <div class="header-actions">
            <h1>Produtos</h1>
            <button class="btn-primary" onclick="abrirModal()">+ Adicionar produto</button>
        </div>

        <div class="filter-bar">
            <input type="text" class="search-input" placeholder="Buscar produtos por nome, SKU ou tags">
            <button style="background:none; border:1px solid var(--border); padding:8px 15px; border-radius:4px; cursor:pointer;"><i class="fas fa-filter"></i> Filtrar</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="400">Produto</th>
                        <th>Estoque</th>
                        <th>Preço</th>
                        <th>Promocional</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-corpo">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

        async function carregarProdutos() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?order=id.desc`, { headers: HEADERS });
            const jogos = await res.json();
            
            document.getElementById('lista-corpo').innerHTML = jogos.map(j => `
                <tr>
                    <td>
                        <div class="prod-info">
                            <img src="${j.url_da_imagem}">
                            <div>
                                <a href="#" class="prod-name">${j.nome}</a>
                                <div class="prod-tags">
                                    <span class="tag-small">${j.categoria || 'Games'}</span>
                                    <span class="tag-small">PC Steam</span>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td><span class="stock-inf">∞</span> <small>Infinito</small></td>
                    <td>R$ <input type="text" class="price-input" value="${j.preco}"></td>
                    <td>R$ <input type="text" class="price-input" value="0.00"></td>
                    <td>
                        <div class="action-icons">
                            <i class="fas fa-share-alt"></i>
                            <i class="fas fa-copy"></i>
                            <i class="fas fa-trash delete-btn" onclick="deletar(${j.id})"></i>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function deletar(id) {
            if(confirm("Deseja apagar este produto?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregarProdutos();
            }
        }

        window.onload = carregarProdutos;
    </script>
</body>
</html>
