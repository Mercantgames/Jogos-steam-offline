<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin MercantGames | Gestão Completa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0066ff; --bg: #f5f7f9; --border: #dce1e5; --text: #333; --white: #fff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; color: var(--text); }

        /* SIDEBAR */
        .sidebar { width: 250px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid var(--border); z-index: 100; }
        .sidebar-logo { padding: 25px; font-weight: 800; color: var(--blue); border-bottom: 1px solid #eee; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 15px 25px; display: flex; align-items: center; gap: 12px; color: #666; text-decoration: none; cursor: pointer; }
        .nav-item.active { background: #f0f7ff; color: var(--blue); font-weight: 600; border-left: 4px solid var(--blue); }

        /* CONTEÚDO */
        .main { margin-left: 250px; width: calc(100% - 250px); padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        /* ESTATÍSTICAS (IGUAL ÀS FOTOS) */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 24px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
        .stat-icon-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .stat-label { font-size: 0.85rem; color: #666; display: block; margin-bottom: 4px; }
        .stat-val { font-size: 1.5rem; font-weight: 700; margin: 0; }
        .stat-badge { font-size: 0.75rem; background: #e6ffed; color: #2ecc71; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

        /* CARDS E FORMULÁRIOS */
        .card { background: var(--white); border-radius: 8px; border: 1px solid var(--border); padding: 25px; margin-bottom: 25px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #999; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .prod-img { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }

        .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; outline: none; }
        
        .btn-blue { background: var(--blue); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-del { color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-cloud"></i> nuvemshop</div>
        <div class="nav-item active" onclick="tab('dash')"><i class="fas fa-home"></i> Início</div>
        <div class="nav-item" onclick="tab('lista')"><i class="fas fa-box"></i> Produtos</div>
        <div class="nav-item" onclick="tab('banners')"><i class="fas fa-image"></i> Banners</div>
    </aside>

    <main class="main">
        
        <div id="dash" class="section active">
            <h1>Resumo</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#eef5ff; color:#0066ff"><i class="fas fa-box"></i></div>
                    <div style="flex:1">
                        <span class="stat-label">Produtos Ativos</span>
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <h2 class="stat-val" id="st-prod">0</h2><span class="stat-badge">DB</span>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#ebfbee; color:#2ecc71"><i class="fas fa-dollar-sign"></i></div>
                    <div style="flex:1">
                        <span class="stat-label">Faturamento Total</span>
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <h2 class="stat-val" id="st-fat">R$ 0,00</h2><span class="stat-badge">Bruto</span>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#f4efff; color:#6a0dad"><i class="fas fa-eye"></i></div>
                    <div style="flex:1">
                        <span class="stat-label">Visitas</span>
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <h2 class="stat-val">1.240</h2><span class="stat-badge" style="background:#eee; color:#888">Agora</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="lista" class="section">
            <div class="header-flex">
                <h1>Produtos</h1>
                <button class="btn-blue" onclick="tab('novo')">+ Novo Produto</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>Produto</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr></thead>
                    <tbody id="corpo-lista"></tbody>
                </table>
            </div>
        </div>

        <div id="novo" class="section">
            <div class="header-flex"><h1>Novo Produto</h1><button class="btn-blue" onclick="salvarProduto()">Salvar Alterações</button></div>
            <div class="form-grid">
                <div class="card">
                    <div class="field"><label>Nome</label><input type="text" id="p-nome"></div>
                    <div class="field"><label>Descrição</label><textarea id="p-desc" rows="5"></textarea></div>
                    <div class="field"><label>Preço</label><input type="text" id="p-preco"></div>
                    <div class="field"><label>URL da Imagem</label><input type="text" id="p-img"></div>
                </div>
                <div class="card">
                    <div class="field"><label>Categoria</label>
                        <select id="p-cat">
                            <option value="Ação">Ação</option><option value="Esportes">Esportes</option><option value="Luta">Luta</option>
                        </select>
                    </div>
                    <div class="field"><label>Marca</label><input type="text" id="p-marca" placeholder="Ex: Capcom"></div>
                </div>
            </div>
        </div>

        <div id="banners" class="section">
            <h1>Banners</h1>
            <div class="card">
                <label>Links (separados por vírgula)</label>
                <textarea id="b-links" rows="6" style="margin-top:10px"></textarea>
                <button class="btn-blue" style="margin-top:15px" onclick="salvarBanners()">Atualizar Banners</button>
            </div>
        </div>

    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            carregarDados();
        }

        async function carregarDados() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?order=id.desc`, { headers: HEADERS });
            const jogos = await res.json();
            
            // 1. ARRUMANDO AS ESTATÍSTICAS
            document.getElementById('st-prod').innerText = jogos.length;
            let total = jogos.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            document.getElementById('st-fat').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;

            // 2. MANTENDO A LISTA
            document.getElementById('corpo-lista').innerHTML = jogos.map(j => `
                <tr>
                    <td><div style="display:flex; align-items:center; gap:10px"><img src="${j.url_da_imagem}" class="prod-img"><b>${j.nome}</b></div></td>
                    <td>R$ ${j.preco}</td>
                    <td>${j.categoria}</td>
                    <td><button class="btn-del" onclick="deletar(${j.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        async function salvarProduto() {
            const body = { nome: document.getElementById('p-nome').value, preco: document.getElementById('p-preco').value, descricao: document.getElementById('p-desc').value, url_da_imagem: document.getElementById('p-img').value, categoria: document.getElementById('p-cat').value, marca: document.getElementById('p-marca').value };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            alert("Salvo!"); tab('lista');
        }

        async function salvarBanners() {
            const links = document.getElementById('b-links').value.split(',').map(l => l.trim());
            await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ banners: links }) });
            alert("Banners Atualizados!");
        }

        async function deletar(id) {
            if(confirm("Excluir?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregarDados();
            }
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
