<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin MercantGames</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 15px; border: 2px solid #003366; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #003366; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #003366; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #007BFF; }
    </style>
</head>
<body>
    <div class="box">
        <h2>CADASTRAR JOGO</h2>
        <input type="text" id="nome" placeholder="Nome do Jogo">
        <input type="number" id="preco" placeholder="Preço (R$)">
        <input type="file" id="arquivo" accept="image/*">
        <button onclick="publicar()">PUBLICAR AGORA 🚀</button>
    </div>

    <script>
        async function publicar() {
            const btn = document.querySelector('button');
            btn.innerText = "Publicando...";
            btn.disabled = true;

            const URL_BASE = "https://grogiwbccvnbyjgxvafw.supabase.co";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
            
            const arquivo = document.getElementById('arquivo').files[0];
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;

            try {
                // 1. Upload da Imagem
                const fileName = `${Date.now()}_${arquivo.name}`;
                const uploadRes = await fetch(`${URL_BASE}/storage/v1/object/capas/${fileName}`, {
                    method: 'POST',
                    headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` },
                    body: arquivo
                });

                if(!uploadRes.ok) throw new Error("Erro ao subir imagem");

                // 2. Salvar no Banco (Ajustado para sua Imagem 420)
                const res = await fetch(`${URL_BASE}/rest/v1/jogos`, {
                    method: 'POST',
                    headers: { 
                        'apikey': KEY, 
                        'Authorization': `Bearer ${KEY}`, 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome: nome,
                        preco: parseFloat(preco),
                        url_da_imagem: `${URL_BASE}/storage/v1/object/public/capas/${fileName}`
                    })
                });

                if(res.ok) {
                    alert("🚀 SUCESSO! Jogo cadastrado.");
                    location.reload();
                } else {
                    const erro = await res.json();
                    alert("Erro: " + erro.message);
                }
            } catch (e) {
                alert("❌ Falha: " + e.message);
            } finally {
                btn.innerText = "PUBLICAR AGORA 🚀";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
