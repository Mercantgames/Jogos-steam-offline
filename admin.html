<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #0066ff; --bg: #f5f7f9; --border: #dce1e5; --text: #333; --white: #fff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; color: var(--text); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid var(--border); }
        .sidebar-logo { padding: 25px; font-weight: 800; color: var(--blue); border-bottom: 1px solid #eee; font-size: 1.2rem; }
        .nav-item { padding: 15px 25px; display: flex; align-items: center; gap: 12px; color: #666; text-decoration: none; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: #f0f7ff; color: var(--blue); font-weight: 600; border-left: 4px solid var(--blue); }

        /* CONTEÚDO */
        .main { margin-left: 240px; width: calc(100% - 240px); padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        /* CARDS */
        .card { background: var(--white); border-radius: 8px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* TABELA LISTAGEM */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #999; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .prod-cell { display: flex; align-items: center; gap: 10px; }
        .prod-cell img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }

        /* FORMULÁRIOS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; font-weight: 600; }
        input, textarea, select { padding: 10px; border: 1px solid var(--border); border-radius: 4px; outline: none; }
        
        .btn-blue { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-del { color: #ff4d4d; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">MERCANT<span>ADMIN</span></div>
        <div class="nav-item active" onclick="showTab('lista')"><i class="fas fa-list"></i> Meus Produtos</div>
        <div class="nav-item" onclick="showTab('novo')"><i class="fas fa-plus-circle"></i> Novo Produto</div>
        <div class="nav-item" onclick="showTab('banners')"><i class="fas fa-images"></i> Banners</div>
        <a href="index.html" class="nav-item" style="margin-top:20px; border-top:1px solid #eee"><i class="fas fa-external-link-alt"></i> Ver Loja</a>
    </aside>

    <main class="main">
        
        <div id="tab-lista" class="section active">
            <div class="header-flex">
                <h1>Produtos</h1>
                <button class="btn-blue" onclick="showTab('novo')">+ Adicionar produto</button>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr><th>Produto</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-novo" class="section">
            <div class="header-flex">
                <h1>Adicionar novo produto</h1>
                <button class="btn-blue" onclick="salvarProduto()">Salvar alterações</button>
            </div>
            <div class="card">
                <h3>Informações básicas</h3>
                <div class="field"><label>Nome</label><input type="text" id="p-nome"></div>
                <div class="field"><label>Descrição</label><textarea id="p-desc" rows="4"></textarea></div>
                <div class="form-grid">
                    <div class="field"><label>Preço</label><input type="text" id="p-preco" placeholder="0.00"></div>
                    <div class="field"><label>Categoria</label>
                        <select id="p-cat">
                            <option value="Ação">Ação</option>
                            <option value="Esportes">Esportes</option>
                            <option value="Luta">Luta</option>
                        </select>
                    </div>
                </div>
                <div class="field"><label>URL da Imagem (Supabase)</label><input type="text" id="p-img"></div>
            </div>
        </div>

        <div id="tab-banners" class="section">
            <h1>Configurar Banners</h1>
            <div class="card">
                <h3>Links das Imagens</h3>
                <p><small>Cole os links separados por vírgula</small></p>
                <textarea id="b-links" rows="6" style="width:100%"></textarea>
                <button class="btn-blue" style="margin-top:15px" onclick="atualizarBanners()">Salvar Banners</button>
            </div>
        </div>

    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function carregarLista() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            const jogos = await res.json();
            document.getElementById('lista-corpo').innerHTML = jogos.map(j => `
                <tr>
                    <td><div class="prod-cell"><img src="${j.url_da_imagem}"><span>${j.nome}</span></div></td>
                    <td>R$ ${j.preco}</td>
                    <td>${j.categoria || 'Geral'}</td>
                    <td><button class="btn-del" onclick="deletar(${j.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        async function salvarProduto() {
            const body = {
                nome: document.getElementById('p-nome').value,
                preco: document.getElementById('p-preco').value,
                descricao: document.getElementById('p-desc').value,
                url_da_imagem: document.getElementById('p-img').value,
                categoria: document.getElementById('p-cat').value
            };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            alert("Produto Salvo!");
            location.reload();
        }

        async function atualizarBanners() {
            const links = document.getElementById('b-links').value.split(',').map(l => l.trim());
            await fetch(`${SB_URL}/rest/v1/configuracoes?id=eq.1`, { 
                method: 'PATCH', headers: HEADERS, body: JSON.stringify({ banners: links }) 
            });
            alert("Banners Atualizados!");
        }

        async function deletar(id) {
            if(confirm("Excluir?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregarLista();
            }
        }

        window.onload = carregarLista;
    </script>
</body>
</html>
