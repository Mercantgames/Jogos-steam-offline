<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gerador | MercantGames</title>
    <style>
        body { background: #E5E4E2; font-family: sans-serif; padding: 40px; }
        .box { background: white; padding: 20px; border-radius: 10px; border: 2px solid #003366; max-width: 500px; margin: auto; }
        h2 { color: #003366; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #003366; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #007BFF; }
        #resultado { margin-top: 20px; display: none; }
        textarea { width: 100%; height: 150px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>GERAR JOGO PARA A LOJA</h2>
    <input type="text" id="nome" placeholder="Nome do Jogo (Ex: GTA V)">
    <input type="text" id="preco" placeholder="Preço (Ex: 29.90)">
    <input type="text" id="imagem" placeholder="Link da Imagem da Capa">
    
    <button onclick="gerar()">GERAR CÓDIGO DO CARD</button>

    <div id="resultado">
        <p><strong>Copie o código abaixo e cole no seu index.html:</strong></p>
        <textarea id="txtCodigo" readonly></textarea>
    </div>
</div>

<script>
    function gerar() {
        const nome = document.getElementById('nome').value;
        const preco = document.getElementById('preco').value;
        const img = document.getElementById('imagem').value;
        
        const html = `
    <div class="game-card">
        <img src="${img}">
        <div class="game-info">
            <h3>${nome}</h3>
            <div class="game-price">R$ ${parseFloat(preco).toFixed(2)}</div>
            <a href="https://wa.me/5511999999999" class="btn-buy" target="_blank">🛒 Comprar Agora</a>
        </div>
    </div>`;

        document.getElementById('txtCodigo').value = html;
        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
