<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Nuvemshop Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* MANTIDO TODO O SEU CSS ORIGINAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background-color: #f9fafb; }
        .sidebar { width: 256px; background: white; border-right: 1px solid #e5e7eb; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; }
        .header { height: 64px; background: white; border-bottom: 1px solid #e5e7eb; position: fixed; top: 0; left: 256px; right: 0; z-index: 10; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        .main-content { margin-left: 256px; margin-top: 64px; min-height: calc(100vh - 64px); padding: 24px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #374151; text-decoration: none; }
        .menu-item:hover { background-color: #f3f4f6; }
        .menu-item.active { background-color: #eff6ff; color: #2563eb; }
        .stat-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; font-size: 14px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .toast { position: fixed; top: 24px; right: 24px; background: white; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: none; z-index: 100; border-left: 4px solid #10b981; }
        .toast.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background-color: #f9fafb; font-weight: 500; color: #6b7280; font-size: 14px; }
        tr:hover { background-color: #f9fafb; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
        .badge-success { background-color: #d1fae5; color: #065f46; }
        .badge-warning { background-color: #fef3c7; color: #92400e; }
        .badge-danger { background-color: #fee2e2; color: #991b1b; }
        input, select { width: 100%; padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .product-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; transition: all 0.2s; }
        .product-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .product-image { width: 100%; aspect-ratio: 1; background-color: #f3f4f6; object-fit: cover; }
    </style>
</head>
<body>
    <div id="toast" class="toast">
        <div class="flex items-center gap-2">
            <i class="fas fa-check-circle text-green-600"></i>
            <span id="toast-message"></span>
        </div>
    </div>

    <aside class="sidebar">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-store text-white"></i>
                </div>
                <span class="font-semibold text-lg">MercantGames</span>
            </div>
        </div>
        <nav class="p-4">
            <a href="#" class="menu-item active" data-section="dashboard"><i class="fas fa-home w-5"></i><span>Dashboard</span></a>
            <a href="#" class="menu-item" data-section="produtos"><i class="fas fa-box w-5"></i><span>Produtos</span></a>
        </nav>
    </aside>

    <header class="header">
        <div style="flex: 1; max-width: 600px;">
            <div style="position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af;"></i>
                <input type="text" placeholder="Buscar produtos..." onkeyup="filterProducts()" id="search-input-header">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="dashboard-section" class="section">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="stat-card">
                    <p class="text-2xl font-bold text-gray-900" id="total-receita">R$ 0,00</p>
                    <p class="text-sm text-gray-500 mt-1">Receita Total (Jogos)</p>
                </div>
                <div class="stat-card">
                    <p class="text-2xl font-bold text-gray-900" id="total-jogos">0</p>
                    <p class="text-sm text-gray-500 mt-1">Jogos Cadastrados</p>
                </div>
            </div>
        </div>

        <div id="produtos-section" class="section hidden">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Produtos</h1>
                <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus mr-2"></i>Novo Jogo</button>
            </div>
            <div class="product-grid" id="products-container">
                </div>
        </div>
    </main>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-xl font-bold text-gray-900">Novo Jogo</h2>
                <button onclick="closeProductModal()"><i class="fas fa-times text-gray-500"></i></button>
            </div>
            <form onsubmit="saveProduct(event)" class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nome do Jogo *</label>
                    <input type="text" id="product-nome" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Preço (R$) *</label>
                    <input type="number" id="product-preco" step="0.01" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">URL da Imagem</label>
                    <input type="text" id="product-imagem" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary w-full">Criar Jogo</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        // Navegação (Mantenho sua lógica)
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const section = this.getAttribute('data-section');
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
                document.getElementById(section + '-section').classList.remove('hidden');
                if(section === 'produtos') renderProducts();
                if(section === 'dashboard') updateStats();
            });
        });

        async function updateStats() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            const jogos = await res.json();
            const total = jogos.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            document.getElementById('total-jogos').innerText = jogos.length;
            document.getElementById('total-receita').innerText = `R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        }

        async function renderProducts() {
            const container = document.getElementById('products-container');
            const res = await fetch(`${SB_URL}/rest/v1/jogos?select=*`, { headers: HEADERS });
            const produtos = await res.json();

            container.innerHTML = produtos.map(p => `
                <div class="product-card">
                    <img src="${p.url_da_imagem || 'https://via.placeholder.com/400'}" class="product-image">
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-900">${p.nome}</h3>
                        <p class="text-xl font-bold text-gray-900 mt-2">R$ ${parseFloat(p.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                        <div class="flex gap-2 mt-4">
                            <button onclick="deleteProduct(${p.id})" class="btn" style="border: 1px solid #fca5a5; color: #dc2626; width: 100%;">
                                <i class="fas fa-trash mr-2"></i>Excluir
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const body = {
                nome: document.getElementById('product-nome').value,
                preco: document.getElementById('product-preco').value,
                url_da_imagem: document.getElementById('product-imagem').value || 'https://via.placeholder.com/400'
            };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            closeProductModal();
            renderProducts();
            showToast("Jogo adicionado!");
        }

        async function deleteProduct(id) {
            if(confirm("Deseja excluir?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                renderProducts();
                showToast("Jogo removido!");
            }
        }

        function openProductModal() { document.getElementById('product-modal').classList.add('active'); }
        function closeProductModal() { document.getElementById('product-modal').classList.remove('active'); }
        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            document.getElementById('toast-message').innerText = msg;
            t.classList.add('active'); 
            setTimeout(() => t.classList.remove('active'), 3000); 
        }

        window.onload = () => { updateStats(); };
    </script>
</body>
</html>
