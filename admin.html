<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --bg: #f6f6f7; }
        body { font-family: sans-serif; background: var(--bg); display: flex; margin: 0; }
        .sidebar { width: 240px; background: #ebebeb; height: 100vh; padding: 20px; border-right: 1px solid #ddd; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: var(--azul); color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--azul)">MercantGames</h2>
        <p>📦 Produtos</p>
    </div>
    <div class="main">
        <h1>Adicionar Jogo</h1>
        <div class="card">
            <input type="text" id="nome" placeholder="Nome do Jogo">
            <input type="number" id="preco" placeholder="Preço (Ex: 59.90)">
            <textarea id="desc" placeholder="Descrição"></textarea>
            <input type="file" id="foto">
            <button class="btn" onclick="salvar()">Salvar Produto</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";

        async function salvar() {
            const file = document.getElementById('foto').files[0];
            if(!file) return alert("Coloque uma foto!");

            // 1. Sobe a imagem
            const fileName = Date.now() + "_" + file.name;
            const resImg = await fetch(`${SB_URL}/storage/v1/object/capas/${fileName}`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` },
                body: file
            });
            const imgData = await resImg.json();
            const urlFinal = `${SB_URL}/storage/v1/object/public/capas/${fileName}`;

            // 2. Salva no Banco
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, {
                method: 'POST',
                headers: { 
                    'apikey': SB_KEY, 
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    nome: document.getElementById('nome').value,
                    preco: document.getElementById('preco').value,
                    descricao: document.getElementById('desc').value,
                    url_da_imagem: urlFinal
                })
            });

            if(res.ok) {
                alert("✅ JOGO SALVO! Agora verifique a loja.");
            } else {
                const erro = await res.json();
                alert("❌ ERRO AO SALVAR: " + erro.message);
            }
        }
    </script>
</body>
</html>
