<div id="produtos" class="aba">
            <h3 style="color: var(--azul);">📦 Cadastro Otimizado para SEO</h3>
            <div class="form-group" style="border-left: 5px solid var(--azul);">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Nome do Jogo (H1):</label>
                        <input type="text" id="p_nome" placeholder="Ex: Elden Ring - Edição Especial">
                    </div>
                    <div>
                        <label>Preço de Venda:</label>
                        <input type="number" id="p_preco" placeholder="0.00">
                    </div>
                </div>

                <label>Descrição Completa (Para o Google):</label>
                <textarea id="p_desc" style="width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;" placeholder="Descreva o jogo, requisitos do sistema e o que vem na compra..."></textarea>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Tags / Palavras-Chave (Separadas por vírgula):</label>
                        <input type="text" id="p_tags" placeholder="rpg, mundo aberto, souls, ação">
                    </div>
                    <div>
                        <label>Categoria Principal:</label>
                        <select id="p_cat">
                            <option>Lançamentos</option>
                            <option>Mais Jogados</option>
                            <option>Promoções</option>
                        </select>
                    </div>
                </div>

                <label>Capa do Produto (Upload PC):</label>
                <input type="file" id="p_file" accept="image/*" onchange="verPreview(this, 'prev-p')">
                <img id="prev-p" class="preview-img" style="max-height: 100px; display:none; margin-bottom: 10px;">

                <button class="btn-acao" onclick="salvarJogoSEO()" style="background: var(--azul);">PUBLICAR JOGO NA VITRINE 🚀</button>
            </div>

            <table id="tabela-produtos">
                <thead>
                    <tr style="background: var(--azul); color: var(--prata);">
                        <th>Capa</th>
                        <th>Informações</th>
                        <th>SEO Tags</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-produtos"></tbody>
            </table>
        </div>

<script>
// ... (mantenha as funções de subirStorage e mudarAba) ...

async function listarProdutos() {
    const res = await fetch(`${URL}/rest/v1/jogos`, { headers: HEAD });
    const dados = await res.json();
    const body = document.getElementById('corpo-produtos');
    body.innerHTML = dados.map(p => `
        <tr>
            <td><img src="${p.url_da_imagem}" width="60" style="border-radius:5px;"></td>
            <td>
                <strong>${p.nome}</strong><br>
                <small style="color: #777;">${p.descricao ? p.descricao.substring(0, 30) + '...' : 'Sem desc.'}</small>
            </td>
            <td><span style="background: var(--prata); color: var(--azul); padding: 2px 5px; border-radius: 4px; font-size: 0.7rem;">${p.tags || 'sem tags'}</span></td>
            <td><b style="color: var(--azul);">R$ ${p.preco}</b></td>
            <td><button onclick="deletarProd(${p.id})" style="border:none; background:none; cursor:pointer;">❌</button></td>
        </tr>
    `).join('');
}

async function salvarJogoSEO() {
    const btn = event.target; btn.innerText = "Processando...";
    const file = document.getElementById('p_file').files[0];
    const url = await subirStorage(file);
    
    if(!url) { alert("A foto é obrigatória para o SEO!"); btn.innerText = "PUBLICAR JOGO"; return; }

    const payload = {
        nome: document.getElementById('p_nome').value,
        preco: document.getElementById('p_preco').value,
        descricao: document.getElementById('p_desc').value,
        tags: document.getElementById('p_tags').value,
        categoria: document.getElementById('p_cat').value,
        url_da_imagem: url
    };

    const res = await fetch(`${URL}/rest/v1/jogos`, {
        method: 'POST', headers: HEAD,
        body: JSON.stringify(payload)
    });

    if(res.ok) {
        alert("Jogo indexado e publicado!");
        listarProdutos();
        // Limpar campos
        document.getElementById('p_nome').value = "";
        document.getElementById('p_desc').value = "";
    }
    btn.innerText = "PUBLICAR JOGO NA VITRINE 🚀";
}
</script>
