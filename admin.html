<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --prata: #E5E4E2; --branco: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: #f4f4f4; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--azul); color: var(--prata); display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar h2 { text-align: center; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .menu-item { padding: 15px 25px; cursor: pointer; display: flex; align-items: center; color: var(--prata); text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); border-left: 4px solid var(--prata); }
        
        /* Conteúdo */
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .aba { display: none; }
        .aba.active { display: block; }
        
        .form-group { background: var(--branco); padding: 25px; border-radius: 12px; border: 1px solid var(--prata); margin-bottom: 30px; }
        label { font-weight: bold; color: var(--azul); display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn-acao { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-acao:hover { background: #004488; }

        /* Preview das Imagens Upadas */
        .preview-img { width: 100%; max-height: 200px; background: #eee; border-radius: 8px; margin-top: 10px; object-fit: cover; border: 2px dashed var(--prata); display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MERCANT ADMIN</h2>
        <div class="menu-item active" onclick="mudarAba('vendas')"><i class="fas fa-chart-line"></i> Vendas</div>
        <div class="menu-item" onclick="mudarAba('produtos')"><i class="fas fa-gamepad"></i> Produtos</div>
        <div class="menu-item" onclick="mudarAba('edicao')"><i class="fas fa-magic"></i> Editar Loja</div>
    </div>

    <div class="main">
        <div id="produtos" class="aba">
            <h3>Cadastrar Novo Jogo</h3>
            <div class="form-group">
                <input type="text" id="p_nome" placeholder="Nome do Jogo">
                <input type="number" id="p_preco" placeholder="Preço R$">
                <select id="p_cat">
                    <option>Lançamentos</option>
                    <option>Ação</option>
                    <option>Simulação</option>
                </select>
                <label>Selecionar Capa do Jogo (PC):</label>
                <input type="file" id="p_file" accept="image/*" onchange="mostrarPreview(this, 'prev-p')">
                <img id="prev-p" class="preview-img">
                <button class="btn-acao" onclick="executarCadastroProduto()">SUBIR JOGO PARA LOJA 🚀</button>
            </div>
        </div>

        <div id="edicao" class="aba">
            <h3>Personalizar Visual da Loja</h3>
            <div class="form-group">
                <label>Nome da Loja:</label>
                <input type="text" id="cfg_nome" placeholder="Ex: MercantGames">
                
                <label>Cor Principal (Azul/Prata):</label>
                <input type="color" id="cfg_cor" value="#003366">
                
                <label>Mudar Banner Principal (Upload PC):</label>
                <input type="file" id="cfg_banner_file" accept="image/*" onchange="mostrarPreview(this, 'prev-b')">
                <img id="prev-b" class="preview-img">
                
                <button class="btn-acao" onclick="executarSalvarLoja()">ATUALIZAR BANNER E CORES 🎨</button>
            </div>
        </div>

        <div id="vendas" class="aba active">
            <h3>Dashboard de Vendas</h3>
            <p>Seu saldo e vendas aparecerão aqui conforme os clientes comprarem.</p>
        </div>
    </div>

    <script>
        const URL_SB = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY_SB = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS_SB = { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` };

        function mudarAba(id) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function mostrarPreview(input, imgId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById(imgId);
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function subirArquivo(inputElement) {
            const file = inputElement.files[0];
            if (!file) return null;

            const fileName = `${Date.now()}_${file.name}`;
            const uploadPath = `${URL_SB}/storage/v1/object/capas/${fileName}`;

            const res = await fetch(uploadPath, {
                method: 'POST',
                headers: HEADERS_SB,
                body: file
            });

            return res.ok ? `${URL_SB}/storage/v1/object/public/capas/${fileName}` : null;
        }

        async function executarCadastroProduto() {
            const btn = event.target;
            btn.innerText = "Subindo imagem...";
            
            const imgUrl = await subirArquivo(document.getElementById('p_file'));
            if (!imgUrl) return alert("Erro ao subir imagem!");

            const dados = {
                nome: document.getElementById('p_nome').value,
                preco: document.getElementById('p_preco').value,
                categoria: document.getElementById('p_cat').value,
                url_da_imagem: imgUrl
            };

            const res = await fetch(`${URL_SB}/rest/v1/jogos`, {
                method: 'POST',
                headers: { ...HEADERS_SB, 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                alert("Jogo cadastrado com sucesso!");
                location.reload();
            }
            btn.innerText = "SUBIR JOGO PARA LOJA 🚀";
        }

        async function executarSalvarLoja() {
            const btn = event.target;
            btn.innerText = "Salvando configurações...";

            const bannerFile = document.getElementById('cfg_banner_file');
            let bannerUrl = null;

            if (bannerFile.files[0]) {
                bannerUrl = await subirArquivo(bannerFile);
            }

            const payload = {
                loja_nome: document.getElementById('cfg_nome').value,
                cor_principal: document.getElementById('cfg_cor').value
            };
            if (bannerUrl) payload.banner_url = bannerUrl;

            const res = await fetch(`${URL_SB}/rest/v1/configuracoes?id=eq.1`, {
                method: 'PATCH',
                headers: { ...HEADERS_SB, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) alert("Loja Personalizada!");
            btn.innerText = "ATUALIZAR BANNER E CORES 🎨";
        }
    </script>
</body>
</html>
