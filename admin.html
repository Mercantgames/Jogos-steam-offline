<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin MercantGames | Gestão Completa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0066ff; --bg: #f5f7f9; --border: #dce1e5; --text: #333; --sub: #666; --white: #ffffff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; color: var(--text); }

        /* SIDEBAR */
        .sidebar { width: 250px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid var(--border); overflow-y: auto; }
        .sidebar-logo { padding: 25px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; }
        .nav-group { padding: 20px 0; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 12px; color: var(--sub); text-decoration: none; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #f0f7ff; color: var(--blue); font-weight: 600; border-left: 4px solid var(--blue); }

        /* MAIN CONTENT */
        .main { margin-left: 250px; width: calc(100% - 250px); padding: 30px 50px; box-sizing: border-box; }
        .section { display: none; }
        .section.active { display: block; }

        /* ESTATÍSTICAS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 24px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
        .stat-icon-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .stat-data { flex: 1; }
        .stat-label { font-size: 0.85rem; color: var(--sub); display: block; margin-bottom: 4px; }
        .stat-row { display: flex; align-items: center; justify-content: space-between; }
        .stat-row h2 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .stat-badge { font-size: 0.75rem; background: #e6ffed; color: #2ecc71; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

        /* TABELAS E CARDS */
        .card { background: var(--white); border-radius: 8px; border: 1px solid var(--border); padding: 25px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #999; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .prod-info { display: flex; align-items: center; gap: 15px; }
        .prod-info img { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
        
        .btn-save { background: var(--blue); color: #fff; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-top: 5px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-cloud" style="color:var(--blue); font-size: 1.5rem;"></i>
            <span style="font-weight: 800; font-size: 1.2rem;">nuvemshop</span>
        </div>
        <div class="nav-group">
            <div id="n-dash" class="nav-item active" onclick="tab('dash')"><i class="fas fa-home"></i> Início</div>
            <div id="n-lista" class="nav-item" onclick="tab('lista')"><i class="fas fa-box"></i> Produtos</div>
            <div id="n-banners" class="nav-item" onclick="tab('banners')"><i class="fas fa-image"></i> Banners</div>
        </div>
    </aside>

    <main class="main">
        
        <div id="dash" class="section active">
            <h1>Início</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#eef5ff; color:#0066ff"><i class="fas fa-shopping-cart"></i></div>
                    <div class="stat-data">
                        <span class="stat-label">Produtos no Banco</span>
                        <div class="stat-row"><h2 id="total-prod">0</h2><span class="stat-badge">DB</span></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#ebfbee; color:#2ecc71"><i class="fas fa-dollar-sign"></i></div>
                    <div class="stat-data">
                        <span class="stat-label">Valor Total</span>
                        <div class="stat-row"><h2 id="total-val">R$ 0,00</h2><span class="stat-badge">Real</span></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-circle" style="background:#f4efff; color:#6a0dad"><i class="fas fa-eye"></i></div>
                    <div class="stat-data">
                        <span class="stat-label">Visitas</span>
                        <div class="stat-row"><h2>1.240</h2><span class="stat-badge" style="background:#eee; color:#888">Agora</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="lista" class="section">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px">
                <h1>Produtos</h1>
                <button class="btn-save" onclick="tab('novo')">+ Novo Jogo</button>
            </div>
            <div class="card" style="padding:0">
                <table>
                    <thead><tr><th>Produto</th><th>Estoque</th><th>Preço</th><th>Ações</th></tr></thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>

        <div id="novo" class="section">
            <h1>Cadastrar Produto</h1>
            <div class="card">
                <label>Nome</label><input type="text" id="p-nome">
                <label>Preço</label><input type="text" id="p-preco">
                <label>Link Imagem</label><input type="text" id="p-img">
                <label>Categoria</label><select id="p-cat"><option>Ação</option><option>RPG</option><option>Esportes</option></select>
                <button class="btn-save" style="margin-top:20px" onclick="salvar()">Salvar</button>
            </div>
        </div>

        <div id="banners" class="section">
            <h1>Banners</h1>
            <div class="card">
                <label>Links (separados por vírgula)</label>
                <textarea id="b-links" rows="5"></textarea>
                <button class="btn-save" onclick="salvarBanners()">Atualizar</button>
            </div>
        </div>

    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('n-'+(id==='novo'?'lista':id)).classList.add('active');
            carregar();
        }

        async function carregar() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?order=id.desc`, { headers: HEADERS });
            const jogos = await res.json();
            
            document.getElementById('total-prod').innerText = jogos.length;
            let soma = jogos.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            document.getElementById('total-val').innerText = `R$ ${soma.toLocaleString('pt-br', {minimumFractionDigits:2})}`;

            document.getElementById('lista-corpo').innerHTML = jogos.map(j => `
                <tr>
                    <td><div class="prod-info"><img src="${j.url_da_imagem}"><b>${j.nome}</b></div></td>
                    <td>∞ Infinito</td>
                    <td>R$ ${j.preco}</td>
                    <td><button onclick="deletar(${j.id})" style="color:red; background:none; border:none; cursor:pointer;">Excluir</button></td>
                </tr>
            `).join('');
        }

        async function salvar() {
            const body = { nome: document.getElementById('p-nome').value, preco: document.getElementById('p-preco').value, url_da_imagem: document.getElementById('p-img').value, categoria: document.getElementById('p-cat').value };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            tab('lista');
        }

        async function deletar(id) {
            if(confirm("Excluir?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregar();
            }
        }

        window.onload = carregar;
    </script>
</body>
</html>
