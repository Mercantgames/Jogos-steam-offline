<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --prata: #E5E4E2; --bg: #f1f1f1; --branco: #ffffff; --border: #d2d2d2; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 240px; background: #ebebeb; border-right: 1px solid var(--border); padding: 10px; shrink: 0; }
        .sidebar-item { padding: 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; font-size: 14px; margin-bottom: 5px; color: #4a4a4a; transition: 0.2s; }
        .sidebar-item i { margin-right: 10px; width: 18px; }
        .sidebar-item.active { background: #dfdfdf; color: #000; font-weight: bold; }

        /* Conteúdo */
        .container { flex: 1; padding: 30px; overflow-y: auto; }
        .aba { display: none; }
        .aba.active { display: block; }
        .card { background: var(--branco); border-radius: 10px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* Formulários */
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-save { background: var(--azul); color: white; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8f8f8; padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .banner-img { width: 100px; height: 50px; object-fit: cover; border-radius: 4px; margin: 5px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="font-weight: bold; padding: 10px; color: var(--azul);">MERCANT GAMES</div>
        <div class="sidebar-item active" onclick="mudarAba('vendas', this)"><i class="fas fa-shopping-cart"></i> Pedidos</div>
        <div class="sidebar-item" onclick="mudarAba('produtos', this)"><i class="fas fa-tag"></i> Produtos / SEO</div>
        <div class="sidebar-item" onclick="mudarAba('config', this)"><i class="fas fa-cog"></i> Configurações</div>
    </div>

    <div class="container">
        <div id="aba-vendas" class="aba active">
            <h2>Pedidos Realizados</h2>
            <div class="card">
                <table>
                    <thead><tr><th>ID</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Status</th></tr></thead>
                    <tbody id="lista-pedidos"></tbody>
                </table>
            </div>
        </div>

        <div id="aba-produtos" class="aba">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <h2>Cadastrar Produto</h2>
                <button class="btn-save" onclick="salvarJogo()">Publicar Jogo</button>
            </div>
            <div class="grid-2">
                <div class="left">
                    <div class="card">
                        <label>Título SEO</label><input type="text" id="p_nome">
                        <label>Descrição Completa</label><textarea id="p_desc" style="height:100px;"></textarea>
                    </div>
                    <div class="card">
                        <label>Imagem da Capa</label>
                        <input type="file" id="p_file" accept="image/*">
                    </div>
                </div>
                <div class="right">
                    <div class="card">
                        <label>Preço R$</label><input type="number" id="p_preco">
                        <label>Tags (Google)</label><input type="text" id="p_tags">
                        <label>Categoria</label>
                        <select id="p_cat"><option>Lançamentos</option><option>Ação</option></select>
                    </div>
                </div>
            </div>
        </div>

        <div id="aba-config" class="aba">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <h2>Configurar Loja</h2>
                <button class="btn-save" onclick="salvarConfig()">Salvar Tudo</button>
            </div>
            <div class="grid-2">
                <div class="left">
                    <div class="card">
                        <label>Adicionar Banner ao Carrossel</label>
                        <input type="file" id="b_file" accept="image/*" onchange="uploadBanner()">
                        <div id="preview-banners"></div>
                    </div>
                </div>
                <div class="right">
                    <div class="card">
                        <label>Nome da Loja</label><input type="text" id="cfg_nome">
                        <label>Cor Identidade</label><input type="color" id="cfg_cor" style="height:45px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_SB = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY_SB = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}`, 'Content-Type': 'application/json' };
        let bannersLista = [];

        function mudarAba(id, el) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
            document.getElementById('aba-' + id).classList.add('active');
            el.classList.add('active');
            if(id === 'vendas') carregarVendas();
            if(id === 'config') carregarConfig();
        }

        async function subirStorage(file) {
            const name = `${Date.now()}_${file.name}`;
            const res = await fetch(`${URL_SB}/storage/v1/object/capas/${name}`, { method: 'POST', headers: { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` }, body: file });
            return res.ok ? `${URL_SB}/storage/v1/object/public/capas/${name}` : null;
        }

        async function carregarVendas() {
            const res = await fetch(`${URL_SB}/rest/v1/vendas`, { headers: HEADERS });
            const dados = await res.json();
            document.getElementById('lista-pedidos').innerHTML = dados.map(v => `<tr><td>#${v.id}</td><td>${v.cliente_nome}</td><td>${v.produto_nome}</td><td>R$ ${v.valor}</td><td>${v.status}</td></tr>`).join('');
        }

        async function salvarJogo() {
            const url = await subirStorage(document.getElementById('p_file').files[0]);
            if(!url) return alert("Selecione a foto!");
            await fetch(`${URL_SB}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ 
                nome: document.getElementById('p_nome').value, preco: document.getElementById('p_preco').value, 
                descricao: document.getElementById('p_desc').value, tags: document.getElementById('p_tags').value, 
                categoria: document.getElementById('p_cat').value, url_da_imagem: url 
            })});
            alert("Jogo Salvo!");
        }

        async function uploadBanner() {
            const url = await subirStorage(document.getElementById('b_file').files[0]);
            if(url) { 
                bannersLista.push(url); 
                renderBanners(); 
            }
        }

        function renderBanners() {
            document.getElementById('preview-banners').innerHTML = bannersLista.map((b, i) => `<img src="${b}" class="banner-img" onclick="bannersLista.splice(${i},1);renderBanners()">`).join('');
        }

        async function carregarConfig() {
            const res = await fetch(`${URL_SB}/rest/v1/configuracoes?id=eq.1`, { headers: HEADERS });
            const [cfg] = await res.json();
            if(cfg) {
                document.getElementById('cfg_nome').value = cfg.loja_nome;
                document.getElementById('cfg_cor').value = cfg.cor_principal;
                bannersLista = cfg.banners || [];
                renderBanners();
            }
        }

        async function salvarConfig() {
            await fetch(`${URL_SB}/rest/v1/configuracoes?id=eq.1`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ 
                loja_nome: document.getElementById('cfg_nome').value, cor_principal: document.getElementById('cfg_cor').value, banners: bannersLista 
            })});
            alert("Configurações Salvas!");
        }

        window.onload = carregarVendas;
    </script>
</body>
</html>
