<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MercantGames</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background-color: #f9fafb; }
        .sidebar { width: 256px; background: white; border-right: 1px solid #e5e7eb; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; }
        .header { height: 64px; background: white; border-bottom: 1px solid #e5e7eb; position: fixed; top: 0; left: 256px; right: 0; z-index: 10; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        .main-content { margin-left: 256px; margin-top: 64px; min-height: calc(100vh - 64px); padding: 24px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #374151; text-decoration: none; }
        .menu-item:hover { background-color: #f3f4f6; }
        .menu-item.active { background-color: #eff6ff; color: #2563eb; }
        .stat-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; font-size: 14px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .toast { position: fixed; top: 24px; right: 24px; background: white; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: none; z-index: 100; border-left: 4px solid #10b981; }
        .toast.active { display: block; }
        .hidden { display: none !important; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .product-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; border-top-width: 4px; }
        input, select { width: 100%; padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="toast" class="toast"><div class="flex items-center gap-2"><i class="fas fa-check-circle text-green-600"></i><span id="toast-message"></span></div></div>

    <aside class="sidebar">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <div class="flex items-center gap-2"><div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><i class="fas fa-store text-white"></i></div><span class="font-semibold text-lg">MercantGames</span></div>
        </div>
        <nav class="p-4">
            <a href="#" class="menu-item active" onclick="showSection('dashboard')"><i class="fas fa-home w-5"></i><span>Dashboard</span></a>
            <a href="#" class="menu-item" onclick="showSection('produtos')"><i class="fas fa-box w-5"></i><span>Meus Jogos</span></a>
        </nav>
    </aside>

    <header class="header">
        <div style="flex: 1; max-width: 600px;"><input type="text" id="search-global" placeholder="Buscar no banco..." onkeyup="carregar()" style="padding-left: 15px;"></div>
        <div class="flex items-center gap-4"><button class="btn btn-primary">Ver Loja</button></div>
    </header>

    <main class="main-content">
        <div id="dashboard-section" class="section">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Visão Geral</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                <div class="stat-card"><p class="text-sm text-gray-500 mb-1">Faturamento Bruto</p><h2 id="dash-money" class="text-3xl font-bold text-gray-900">R$ 0,00</h2></div>
                <div class="stat-card"><p class="text-sm text-gray-500 mb-1">Total de Jogos</p><h2 id="dash-count" class="text-3xl font-bold text-gray-900">0</h2></div>
                <div class="stat-card"><p class="text-sm text-gray-500 mb-1">Status do Banco</p><h2 class="text-xl font-bold text-green-600">Online</h2></div>
            </div>
        </div>

        <div id="produtos-section" class="section hidden">
            <div class="flex items-center justify-between mb-6">
                <div><h1 class="text-2xl font-bold text-gray-900">Catálogo de Jogos</h1></div>
                <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus mr-2"></i>Novo Jogo</button>
            </div>
            <div class="product-grid" id="products-container"></div>
        </div>
    </main>

    <div id="product-modal" class="modal">
        <div class="modal-content p-6">
            <h2 class="text-xl font-bold mb-4">Adicionar Jogo ao Supabase</h2>
            <div class="space-y-4">
                <input type="text" id="p-nome" placeholder="Nome do Jogo">
                <input type="number" id="p-preco" placeholder="Preço (R$)">
                <select id="p-categoria">
                    <option value="Ação">Ação (Vermelho)</option>
                    <option value="RPG">RPG (Verde)</option>
                    <option value="Aventura">Aventura (Laranja)</option>
                    <option value="Esporte">Esporte (Azul)</option>
                </select>
                <input type="text" id="p-img" placeholder="URL da Imagem">
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeProductModal()" class="btn border flex-1">Cancelar</button>
                <button onclick="salvar()" class="btn btn-primary flex-1">Publicar Agora</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
        const SB_HEADERS = {
            'apikey': "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14",
            'Authorization': "Bearer sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14",
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function openProductModal() { document.getElementById('product-modal').classList.add('active'); }
        function closeProductModal() { document.getElementById('product-modal').classList.remove('active'); }

        async function carregar() {
            const res = await fetch(SB_URL + "?select=*", { headers: SB_HEADERS });
            const dados = await res.json();

            // Dashboard
            document.getElementById('dash-count').innerText = dados.length;
            const total = dados.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            document.getElementById('dash-money').innerText = `R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

            // Grid com CORES POR JOGO
            const container = document.getElementById('products-container');
            container.innerHTML = dados.map(j => {
                let cor = "#3b82f6";
                if(j.categoria === 'Ação') cor = "#ef4444";
                if(j.categoria === 'RPG') cor = "#22c55e";
                if(j.categoria === 'Aventura') cor = "#f97316";

                return `
                <div class="product-card" style="border-top-color: ${cor}">
                    <img src="${j.url_da_imagem || 'https://via.placeholder.com/400'}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <span class="text-[10px] uppercase font-bold px-2 py-1 rounded bg-gray-100" style="color: ${cor}">${j.categoria}</span>
                        <h3 class="font-bold text-gray-900 mt-2">${j.nome}</h3>
                        <p class="text-xl font-bold text-blue-600 mt-1">R$ ${parseFloat(j.preco).toFixed(2)}</p>
                        <button onclick="excluir(${j.id})" class="mt-4 w-full text-red-500 text-xs font-bold py-2 border border-red-100 rounded hover:bg-red-50">EXCLUIR</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function salvar() {
            const payload = {
                nome: document.getElementById('p-nome').value,
                preco: parseFloat(document.getElementById('p-preco').value),
                categoria: document.getElementById('p-categoria').value,
                url_da_imagem: document.getElementById('p-img').value
            };
            await fetch(SB_URL, { method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload) });
            closeProductModal();
            carregar();
        }

        async function excluir(id) {
            if(!confirm("Deletar jogo?")) return;
            await fetch(`${SB_URL}?id=eq.${id}`, { method: 'DELETE', headers: SB_HEADERS });
            carregar();
        }

        carregar();
    </script>
</body>
</html>
