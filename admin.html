<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MercantGames Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{--primary:#2563eb}
body{font-family:Inter,system-ui;background:#f9fafb}
.sidebar{width:260px;height:100vh;position:fixed;background:#fff;border-right}
.header{height:64px;position:fixed;left:260px;right:0;background:#fff;border-bottom;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.main{margin-left:260px;margin-top:64px;padding:24px}
.menu-item{padding:12px 16px;border-radius:8px;cursor:pointer;display:flex;gap:12px}
.menu-item.active{background:#eff6ff;color:var(--primary)}
.section{display:none}
.section.active{display:block}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px}
.game-card{border-top:5px solid #e5e7eb}
.toast{position:fixed;top:24px;right:24px;background:#fff;padding:16px;border-left:4px solid #22c55e;display:none;z-index:50}
.toast.active{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
.modal.active{display:flex}
button.primary{background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px}
</style>
</head>

<body>

<div id="toast" class="toast">✔ Ação realizada</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="bg-white p-6 rounded w-96">
<h2 class="font-bold mb-4">Novo Jogo</h2>
<input id="jogoNome" class="border p-2 w-full mb-2" placeholder="Nome">
<input id="jogoPreco" class="border p-2 w-full mb-2" placeholder="Preço">
<select id="jogoCategoria" class="border p-2 w-full mb-4">
<option value="Ação">Ação</option>
<option value="RPG">RPG</option>
<option value="Aventura">Aventura</option>
<option value="Esporte">Esporte</option>
</select>
<button onclick="criarJogo()" class="primary w-full">Salvar</button>
</div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar p-4">
<h2 class="font-bold text-lg mb-6">MercantGames</h2>
<div class="menu-item active" data-section="dashboard"><i class="fa fa-home"></i>Dashboard</div>
<div class="menu-item" data-section="produtos"><i class="fa fa-gamepad"></i>Jogos</div>
</aside>

<!-- HEADER -->
<header class="header">
<span class="font-semibold">Painel Administrativo</span>
<button onclick="openModal()" class="primary">Novo Jogo</button>
</header>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="dashboard" class="section active">
<div class="grid grid-cols-2 gap-4">
<div class="card">💰 Faturamento Total<br><b id="dash-money">R$ 0,00</b></div>
<div class="card">🎮 Total de Jogos<br><b id="dash-count">0</b></div>
</div>
</section>

<!-- PRODUTOS -->
<section id="produtos" class="section">
<div id="listaJogos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</section>

</main>

<script>
/* ================== CONFIG SUPABASE ================== */
const SUPABASE_URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos"
const SUPABASE_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14"

const headers = {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY,
"Content-Type": "application/json"
}

/* ================== NAVEGAÇÃO ================== */
document.querySelectorAll('.menu-item').forEach(item=>{
item.onclick=()=>{
document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('active'))
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
item.classList.add('active')
document.getElementById(item.dataset.section).classList.add('active')
}
})

/* ================== UTIL ================== */
function showToast(msg){
const t=document.getElementById('toast')
t.innerText=msg
t.classList.add('active')
setTimeout(()=>t.classList.remove('active'),3000)
}
function openModal(){modal.classList.add('active')}
function closeModal(){modal.classList.remove('active')}

/* ================== CATEGORIA COR ================== */
function corCategoria(cat){
return {
"Ação":"#ef4444",
"RPG":"#22c55e",
"Aventura":"#f97316",
"Esporte":"#3b82f6"
}[cat] || "#e5e7eb"
}

/* ================== CRUD ================== */
async function carregarJogos(){
const res = await fetch(SUPABASE_URL + "?select=*", {headers})
const jogos = await res.json()

let total = 0
listaJogos.innerHTML = ""

jogos.forEach(j=>{
total += Number(j.preco)

listaJogos.innerHTML += `
<div class="card game-card" style="border-top-color:${corCategoria(j.categoria)}">
<h3 class="font-bold">${j.nome}</h3>
<p class="text-sm text-gray-500">${j.categoria}</p>
<b>R$ ${Number(j.preco).toFixed(2)}</b>
</div>`
})

document.getElementById("dash-count").innerText = jogos.length
document.getElementById("dash-money").innerText = "R$ " + total.toFixed(2)
}

async function criarJogo(){
await fetch(SUPABASE_URL,{
method:"POST",
headers,
body:JSON.stringify({
nome:jogoNome.value,
preco:jogoPreco.value,
categoria:jogoCategoria.value
})
})
jogoNome.value="";jogoPreco.value=""
closeModal()
showToast("Jogo criado")
carregarJogos()
}

/* ================== INIT ================== */
async function init(){
await carregarJogos()
}
init()
</script>

</body>
</html>
