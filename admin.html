<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin MercantGames | Visão Geral</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0066ff; --bg: #f8f9fa; --border: #dce1e5; --text: #1a1f36; --sub: #697386; --white: #ffffff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; color: var(--text); }

        /* SIDEBAR */
        .sidebar { width: 250px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid var(--border); }
        .sidebar-logo { padding: 25px; font-weight: 800; color: var(--blue); font-size: 1.3rem; border-bottom: 1px solid #f0f2f5; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 12px; color: var(--sub); cursor: pointer; font-size: 0.95rem; }
        .nav-item.active { background: #f4f7ff; color: var(--blue); font-weight: 600; border-left: 4px solid var(--blue); }

        /* CONTEÚDO PRINCIPAL */
        .main { margin-left: 250px; width: calc(100% - 250px); padding: 40px; box-sizing: border-box; }
        .section { display: none; }
        .section.active { display: block; }

        /* DASHBOARD (IGUAL À FOTO APROVADA) */
        .dashboard-container { background: var(--white); border-radius: 12px; border: 1px solid var(--border); padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .stat-box { border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .stat-label { font-size: 0.85rem; color: var(--sub); margin-bottom: 8px; display: block; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text); }
        .stat-variation { color: #2ecc71; font-size: 0.75rem; font-weight: 600; float: right; }

        /* TABELA DE PRODUTOS */
        .card { background: var(--white); border-radius: 10px; border: 1px solid var(--border); padding: 25px; margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #a5adbb; font-size: 0.75rem; border-bottom: 1px solid #f0f2f5; }
        td { padding: 12px; border-bottom: 1px solid #f0f2f5; font-size: 0.9rem; }
        .btn-blue { background: var(--blue); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">nuvemshop</div>
        <div class="nav-item active" onclick="tab('dash')"><i class="fas fa-home"></i> Início</div>
        <div class="nav-item" onclick="tab('lista')"><i class="fas fa-box"></i> Produtos</div>
        <div class="nav-item" onclick="tab('banners')"><i class="fas fa-image"></i> Banners</div>
    </aside>

    <main class="main">
        
        <div id="dash" class="section active">
            <h1>Visão geral</h1>
            <div class="dashboard-container">
                <h3>Sua loja em números: visão geral</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <div style="background:#fafafa; border:1px solid #eee; border-radius:8px; height: 200px;"></div>
                    
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-label">Vendas</span>
                            <div class="stat-value" id="val-vendas">0</div>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Receita</span>
                            <div class="stat-value" id="val-receita">R$ 0,00</div>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Visitas</span>
                            <div class="stat-value">1.240</div>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Ticket médio</span>
                            <div class="stat-value" id="val-ticket">R$ 0,00</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="lista" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h1>Meus Produtos</h1>
                <button class="btn-blue" onclick="tab('novo')">+ Novo Jogo</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>Jogo</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr></thead>
                    <tbody id="corpo-lista"></tbody>
                </table>
            </div>
        </div>

        <div id="banners" class="section">
            <h1>Banners</h1>
            <div class="card">
                <label>Links dos Banners (vírgula)</label>
                <textarea id="b-links" rows="5" style="width:100%; margin-top:10px; border:1px solid #ddd; border-radius:6px;"></textarea>
                <button class="btn-blue" style="margin-top:10px" onclick="salvarBanners()">Atualizar Banners</button>
            </div>
        </div>

        <div id="novo" class="section">
            <h1>Cadastrar Produto</h1>
            <div class="card">
                <input type="text" id="p-nome" placeholder="Nome do Jogo" style="width:100%; padding:12px; margin-bottom:15px;">
                <input type="text" id="p-preco" placeholder="Preço" style="width:100%; padding:12px; margin-bottom:15px;">
                <input type="text" id="p-img" placeholder="Link da Imagem" style="width:100%; padding:12px; margin-bottom:15px;">
                <button class="btn-blue" onclick="salvar()">Salvar</button>
            </div>
        </div>

    </main>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            carregar();
        }

        async function carregar() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos?order=id.desc`, { headers: HEADERS });
            const jogos = await res.json();
            
            // CÁLCULO REAL
            let receita = jogos.reduce((acc, j) => acc + parseFloat(j.preco || 0), 0);
            let ticket = jogos.length > 0 ? (receita / jogos.length) : 0;

            document.getElementById('val-vendas').innerText = jogos.length; // Simulando vendas pela qtd de produtos por enquanto
            document.getElementById('val-receita').innerText = `R$ ${receita.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
            document.getElementById('val-ticket').innerText = `R$ ${ticket.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;

            document.getElementById('corpo-lista').innerHTML = jogos.map(j => `
                <tr>
                    <td><img src="${j.url_da_imagem}" style="width:40px; border-radius:4px;"> ${j.nome}</td>
                    <td>R$ ${j.preco}</td>
                    <td>${j.categoria || 'Geral'}</td>
                    <td><button onclick="deletar(${j.id})" style="color:red; background:none; border:none; cursor:pointer;">Excluir</button></td>
                </tr>
            `).join('');
        }

        async function salvar() {
            const body = { nome: document.getElementById('p-nome').value, preco: document.getElementById('p-preco').value, url_da_imagem: document.getElementById('p-img').value };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            tab('lista');
        }

        async function deletar(id) {
            if(confirm("Excluir?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregar();
            }
        }

        window.onload = carregar;
    </script>
</body>
</html>
