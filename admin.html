<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --prata: #E5E4E2; --bg: #f6f6f7; --border: #d2d2d2; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); display: flex; color: #303030; }
        
        .sidebar { width: 240px; background: #ebebeb; height: 100vh; border-right: 1px solid var(--border); padding: 10px; shrink: 0; }
        .sidebar-item { padding: 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; font-size: 14px; color: #4a4a4a; }
        .sidebar-item.active { background: #dfdfdf; font-weight: bold; color: #000; }

        .container { flex: 1; padding: 20px 60px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Grid Principal */
        .product-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: #fff; border-radius: 8px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card-header { font-size: 14px; font-weight: 600; margin-bottom: 15px; display: block; }

        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; margin-top: 5px; font-size: 14px; box-sizing: border-box; }
        
        /* Campos Lado a Lado */
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }

        /* SEO Preview */
        .seo-preview { border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
        .seo-title { color: #1a0dab; font-size: 18px; text-decoration: none; display: block; }
        .seo-url { color: #006621; font-size: 14px; }
        .seo-desc { color: #545454; font-size: 13px; line-height: 1.4; }

        .btn-save { background: var(--azul); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .media-box { border: 2px dashed #ccc; padding: 30px; text-align: center; border-radius: 8px; background: #fafafa; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="font-weight: bold; padding: 10px; color: var(--azul);">MERCANT GAMES</div>
        <div class="sidebar-item"><i class="fas fa-home"></i> Início</div>
        <div class="sidebar-item"><i class="fas fa-shopping-cart"></i> Pedidos</div>
        <div class="sidebar-item active"><i class="fas fa-tag"></i> Produtos</div>
    </div>

    <div class="container">
        <div class="header-action">
            <h2>📦 Adicionar produto</h2>
            <button class="btn-save" onclick="salvarCompleto()">Salvar produto</button>
        </div>

        <div class="product-layout">
            <div class="main-content">
                <div class="card">
                    <label class="card-header">Título</label>
                    <input type="text" id="p_nome" placeholder="Ex: Elden Ring - Deluxe Edition PC" oninput="updateSEO()">
                    
                    <label class="card-header" style="margin-top:20px;">Descrição</label>
                    <textarea id="p_desc" style="height: 150px;" oninput="updateSEO()"></textarea>
                </div>

                <div class="card">
                    <label class="card-header">Mídia</label>
                    <div class="media-box" onclick="document.getElementById('p_file').click()">
                        <i class="fas fa-plus"></i><br>Fazer upload
                        <input type="file" id="p_file" hidden accept="image/*">
                    </div>
                </div>

                <div class="card">
                    <label class="card-header">Preços</label>
                    <div class="row-2">
                        <div>
                            <label style="font-size:12px;">Preço de venda</label>
                            <input type="number" id="p_preco" placeholder="R$ 0,00">
                        </div>
                        <div>
                            <label style="font-size:12px;">Preço comparativo (De:)</label>
                            <input type="number" id="p_preco_antigo" placeholder="R$ 0,00">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <label class="card-header">Visualização da listagem nos mecanismos de pesquisa</label>
                    <div class="seo-preview">
                        <span class="seo-title" id="seo-prev-title">Título do Produto</span>
                        <span class="seo-url">mercantgames.com.br/products/game</span>
                        <span class="seo-desc" id="seo-prev-desc">Adicione uma descrição para ver como o Google exibirá seu jogo para os clientes.</span>
                    </div>
                </div>
            </div>

            <div class="side-content">
                <div class="card">
                    <label class="card-header">Status do produto</label>
                    <select id="p_status">
                        <option value="Ativo">Ativo</option>
                        <option value="Arquivado">Arquivado</option>
                        <option value="Rascunho">Rascunho</option>
                    </select>
                </div>

                <div class="card">
                    <label class="card-header">Organização</label>
                    <label style="font-size:12px;">Categoria</label>
                    <select id="p_cat">
                        <option>Lançamentos</option>
                        <option>Promoções</option>
                    </select>
                    
                    <label style="font-size:12px; margin-top:15px; display:block;">Tags (Palavras-chave)</label>
                    <input type="text" id="p_tags" placeholder="rpg, aventura, pc">
                </div>

                <div class="card">
                    <label class="card-header">Estoque</label>
                    <label style="font-size:12px;">SKU (Código da Unidade de Manutenção de Estoque)</label>
                    <input type="text" id="p_sku" placeholder="MG-001">
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateSEO() {
            const nome = document.getElementById('p_nome').value;
            const desc = document.getElementById('p_desc').value;
            document.getElementById('seo-prev-title').innerText = nome || "Título do Produto";
            document.getElementById('seo-prev-desc').innerText = desc || "Adicione uma descrição para ver como o Google exibirá seu jogo.";
        }

        async function salvarCompleto() {
            // Aqui entra a lógica de salvar no Supabase que já temos pronta.
            alert("Salvando com SEO e Preço Comparativo!");
        }
    </script>
</body>
</html>
