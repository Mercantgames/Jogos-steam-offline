<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003366; --prata: #E5E4E2; --branco: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: #f4f4f4; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--azul); color: var(--prata); display: flex; flex-direction: column; padding: 20px 0; shrink: 0; }
        .sidebar h2 { text-align: center; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .menu-item { padding: 15px 25px; cursor: pointer; display: flex; align-items: center; color: var(--prata); text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); border-left: 4px solid var(--prata); }
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .aba { display: none; }
        .aba.active { display: block; }
        .form-group { background: var(--branco); padding: 25px; border-radius: 12px; border: 1px solid var(--prata); margin-bottom: 30px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-acao { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 20px; }
        th { background: var(--azul); color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .banner-item { display: flex; align-items: center; gap: 15px; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; }
        .banner-item img { width: 120px; height: 60px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MERCANT ADMIN</h2>
        <div class="menu-item" onclick="mudarAba('vendas')"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="menu-item" onclick="mudarAba('produtos')"><i class="fas fa-gamepad"></i> Produtos</div>
        <div class="menu-item active" onclick="mudarAba('edicao')"><i class="fas fa-magic"></i> Editar Loja</div>
    </div>

    <div class="main">
        <div id="vendas" class="aba">
            <h3>Dashboard Financeiro</h3>
            <div id="resumo">Saldo: <b id="saldo-valor">R$ 0,00</b> | Pedidos: <b id="vendas-total">0</b></div>
            <table id="tabela-vendas"></table>
        </div>

        <div id="produtos" class="aba">
            <h3>Produtos</h3>
            <div class="form-group">
                <input type="text" id="p_nome" placeholder="Nome">
                <input type="number" id="p_preco" placeholder="Preço">
                <input type="file" id="p_file">
                <button class="btn-acao" onclick="salvarProduto()">CADASTRAR JOGO</button>
            </div>
            <table id="tabela-produtos"></table>
        </div>

        <div id="edicao" class="aba active">
            <h3>Personalizar Banners e Visual</h3>
            <div class="form-group">
                <label>Nome da Loja:</label>
                <input type="text" id="cfg_nome">
                
                <label>Adicionar Novo Banner (Foto do PC):</label>
                <input type="file" id="new_banner_file" accept="image/*">
                <button class="btn-acao" onclick="addBanner()" style="background: #27ae60;">+ ADICIONAR BANNER À LISTA</button>
                
                <h4 style="margin-top:20px;">Meus Banners Atuais:</h4>
                <div id="lista-banners">
                    </div>

                <label>Cor da Loja:</label>
                <input type="color" id="cfg_cor">
                <button class="btn-acao" onclick="salvarGeral()">SALVAR TUDO NA LOJA 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEAD = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' };
        let bannersAtuais = [];

        function mudarAba(id) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function subirArquivo(file) {
            const name = `${Date.now()}_${file.name}`;
            const res = await fetch(`${URL}/storage/v1/object/capas/${name}`, { method: 'POST', headers: {'apikey': KEY, 'Authorization': `Bearer ${KEY}`}, body: file });
            return res.ok ? `${URL}/storage/v1/object/public/capas/${name}` : null;
        }

        async function carregarConfig() {
            const res = await fetch(`${URL}/rest/v1/configuracoes?id=eq.1`, { headers: HEAD });
            const [cfg] = await res.json();
            if(cfg) {
                document.getElementById('cfg_nome').value = cfg.loja_nome;
                document.getElementById('cfg_cor').value = cfg.cor_principal;
                bannersAtuais = cfg.banners || [];
                renderBanners();
            }
        }

        function renderBanners() {
            const div = document.getElementById('lista-banners');
            div.innerHTML = bannersAtuais.map((url, index) => `
                <div class="banner-item">
                    <img src="${url}">
                    <span>Banner ${index + 1}</span>
                    <button onclick="removerBanner(${index})" style="margin-left:auto; color:red; border:none; background:none; cursor:pointer;">Excluir</button>
                </div>
            `).join('');
        }

        async function addBanner() {
            const file = document.getElementById('new_banner_file').files[0];
            if(!file) return alert("Selecione uma foto!");
            const url = await subirArquivo(file);
            if(url) {
                bannersAtuais.push(url);
                renderBanners();
                alert("Banner adicionado à lista! Não esqueça de clicar em SALVAR TUDO.");
            }
        }

        function removerBanner(index) {
            bannersAtuais.splice(index, 1);
            renderBanners();
        }

        async function salvarGeral() {
            await fetch(`${URL}/rest/v1/configuracoes?id=eq.1`, {
                method: 'PATCH', headers: HEAD,
                body: JSON.stringify({
                    loja_nome: document.getElementById('cfg_nome').value,
                    cor_principal: document.getElementById('cfg_cor').value,
                    banners: bannersAtuais
                })
            });
            alert("Loja atualizada com sucesso!");
        }

        window.onload = carregarConfig;
    </script>
</body>
</html>
