<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <style>
        body { background: #003366; font-family: sans-serif; color: white; text-align: center; padding: 50px; }
        .card { background: white; color: #333; padding: 30px; border-radius: 12px; display: inline-block; width: 350px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Adicionar Novo Jogo</h2>
        <input type="text" id="n" placeholder="Nome do Jogo (ex: Elden Ring)">
        <input type="number" id="p" placeholder="Preço (ex: 29.90)">
        <input type="text" id="i" placeholder="URL da Imagem (Capa Vertical)">
        <button onclick="postar()">PUBLICAR AGORA</button>
    </div>

    <script>
        async function postar() {
            const URL = "https://grogiwbccvnbyjgxvafw.supabase.co/rest/v1/jogos";
            const KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
            
            const dados = { 
                nome: document.getElementById('n').value, 
                preco: parseFloat(document.getElementById('p').value), 
                imagem_url: document.getElementById('i').value 
            };

            const res = await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if(res.ok) { alert("✅ Jogo cadastrado!"); location.reload(); }
            else { alert("❌ Erro ao salvar no banco!"); }
        }
    </script>
</body>
</html>
