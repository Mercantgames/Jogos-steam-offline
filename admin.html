<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | MercantGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --nuvem-blue: #4a90e2;
            --nuvem-gray-bg: #f8f9fa;
            --nuvem-text: #444;
            --sidebar-width: 240px;
        }

        body { 
            margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--nuvem-gray-bg); color: var(--nuvem-text); 
            display: flex;
        }

        /* SIDEBAR ESTILO NUVEMSHOP */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            height: 100vh;
            position: fixed;
            border-right: 1px solid #e1e4e8;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 0 25px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--nuvem-blue);
            text-transform: uppercase;
        }

        .nav-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666;
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-item:hover { background: #f0f7ff; color: var(--nuvem-blue); }
        .nav-item.active {
            background: #f0f7ff;
            color: var(--nuvem-blue);
            border-left-color: var(--nuvem-blue);
            font-weight: 600;
        }

        /* CONTEÚDO PRINCIPAL */
        .main {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 40px;
        }

        .header-page {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-primary {
            background: var(--nuvem-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        /* CARDS RESUMO */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }

        .stat-card span { font-size: 0.85rem; color: #888; }
        .stat-card h2 { margin: 5px 0 0; font-size: 1.5rem; color: #222; }

        /* TABELA DE PRODUTOS */
        .content-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #fcfcfc; 
            padding: 15px; 
            text-align: left; 
            font-size: 0.85rem; 
            color: #999; 
            border-bottom: 1px solid #eee;
            text-transform: uppercase;
        }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        
        .product-cell { display: flex; align-items: center; gap: 12px; }
        .product-cell img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; border: 1px solid #eee; }

        .price-tag { font-weight: 600; color: #333; }
        
        .actions-btn {
            background: none; border: none; color: #999; cursor: pointer; padding: 5px;
        }
        .actions-btn:hover { color: #f44336; }

        /* MODAL SIMPLES (NUVEMSHOP FEEL) */
        #modal-add {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: white; width: 500px; padding: 30px; border-radius: 8px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-logo, .nav-item span { display: none; }
            .main { margin-left: 60px; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">Mercant</div>
        <a href="#" class="nav-item active"><i class="fas fa-box"></i> <span>Produtos</span></a>
        <a href="#" class="nav-item"><i class="fas fa-shopping-cart"></i> <span>Vendas</span></a>
        <a href="#" class="nav-item"><i class="fas fa-paint-brush"></i> <span>Personalizar</span></a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i> <span>Configurações</span></a>
        <div style="margin-top: auto; padding: 20px;">
            <a href="index.html" class="nav-item" style="border:1px solid #eee; border-radius: 6px;"><i class="fas fa-external-link-alt"></i> <span>Ver Loja</span></a>
        </div>
    </div>

    <div class="main">
        <div class="header-page">
            <h1>Produtos</h1>
            <button class="btn-primary" onclick="toggleModal(true)">+ Adicionar Produto</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span>Total de Produtos</span><h2 id="total-p">0</h2></div>
            <div class="stat-card"><span>Preço Médio</span><h2>R$ 145,90</h2></div>
            <div class="stat-card"><span>Mais Vendido</span><h2>Elden Ring</h2></div>
        </div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modal-add">
        <div class="modal-content">
            <h2>Novo Jogo</h2>
            <div class="form-group"><label>Nome</label><input type="text" id="nome"></div>
            <div class="form-group"><label>Preço</label><input type="text" id="preco"></div>
            <div class="form-group"><label>URL da Imagem</label><input type="text" id="img"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-primary" style="flex:1" onclick="salvar()">Criar Produto</button>
                <button onclick="toggleModal(false)" style="background:#eee; border:none; padding:10px; border-radius:6px; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://grogiwbccvnbyjgxvafw.supabase.co";
        const SB_KEY = "sb_publishable_6XLbmbjPmopxhOm2-_iwRw_6o0mQg14";
        const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

        function toggleModal(show) { document.getElementById('modal-add').style.display = show ? 'flex' : 'none'; }

        async function carregar() {
            const res = await fetch(`${SB_URL}/rest/v1/jogos`, { headers: HEADERS });
            const jogos = await res.json();
            document.getElementById('total-p').innerText = jogos.length;
            document.getElementById('tabela-corpo').innerHTML = jogos.map(j => `
                <tr>
                    <td>
                        <div class="product-cell">
                            <img src="${j.url_da_imagem}">
                            <span>${j.nome}</span>
                        </div>
                    </td>
                    <td><span class="price-tag">R$ ${j.preco}</span></td>
                    <td>${j.categoria || 'Games'}</td>
                    <td>
                        <button class="actions-btn" onclick="deletar(${j.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function salvar() {
            const body = { 
                nome: document.getElementById('nome').value, 
                preco: document.getElementById('preco').value, 
                url_da_imagem: document.getElementById('img').value 
            };
            await fetch(`${SB_URL}/rest/v1/jogos`, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
            toggleModal(false);
            carregar();
        }

        async function deletar(id) {
            if(confirm("Deseja apagar este produto?")) {
                await fetch(`${SB_URL}/rest/v1/jogos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
                carregar();
            }
        }

        window.onload = carregar;
    </script>
</body>
</html>
